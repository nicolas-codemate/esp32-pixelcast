        description: >
          Same payload as `POST /api/gauge`, except that a name over fifteen
          characters and an oversized `rows` array are dropped with a serial log
          instead of an HTTP 400, and an unknown `staleBehavior` falls back to
          `dim` instead of being rejected. Watch the payload size: the MQTT
          receive buffer is 2048 bytes (`MQTT_BUFFER_SIZE`) and nine rows come
          close to 1.3 KB, so a broker message longer than the buffer is dropped
          before the firmware ever parses it. Coloring a `title` or a `label`
          costs around 30 bytes a segment - `[{"t":"5h","c":"#FFFFFF"},{"t":"
          reset","c":"#888888"}]` against `"5h reset"` - which a nine-row gauge
          cannot afford: keep the labels plain over MQTT on a full gauge, or
          split the push into fewer rows per message. REST has no such ceiling.
