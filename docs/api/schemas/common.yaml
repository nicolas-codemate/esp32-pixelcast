# Shared types used across all API schemas
# OpenAPI 3.1 / JSON Schema 2020-12

Color:
  description: >
    Color value. Accepts RGB array, hex string, or unsigned 32-bit integer.
  oneOf:
    - type: array
      items:
        type: integer
        minimum: 0
        maximum: 255
      minItems: 3
      maxItems: 3
      description: "RGB array [R, G, B]"
      examples:
        - [255, 136, 0]
    - type: string
      pattern: "^#[0-9a-fA-F]{6}$"
      description: "Hex string"
      examples:
        - "#FF8800"
    - type: integer
      minimum: 0
      maximum: 16777215
      description: "Unsigned 32-bit integer (0xRRGGBB)"
      examples:
        - 16746496

TextSegment:
  type: object
  required: [t, c]
  properties:
    t:
      type: string
      description: Text content for this segment.
    c:
      $ref: "#/Color"
  description: A text fragment with its own color.

PolymorphicTextField:
  description: >
    Text field accepting three formats: plain string, colored string object,
    or array of colored segments (max 8).
  oneOf:
    - type: string
      description: Plain text (uses default color).
      examples:
        - "22.5C"
    - type: object
      required: [text, color]
      properties:
        text:
          type: string
        color:
          $ref: "#/Color"
      description: "Single string with explicit color override."
      examples:
        - text: "CRITICAL"
          color: "#FF0000"
    - type: array
      items:
        $ref: "#/TextSegment"
      minItems: 1
      maxItems: 8
      description: "Array of colored segments (concatenated in display order)."
      examples:
        - - t: "22.5"
            c: "#FF8800"
          - t: "C"
            c: "#666666"

PolymorphicTextField31x4:
  description: >
    Polymorphic text field bounded to 31 characters and 4 segments. Each bound sits in
    the form it applies to, so a plain string is only measured in characters and a
    segment array only in segments. The character budget is shared by every segment.
  oneOf:
    - type: string
      maxLength: 31
      description: Plain text (uses default color).
    - type: object
      required: [text, color]
      properties:
        text:
          type: string
          maxLength: 31
        color:
          $ref: "#/Color"
      description: "Single string with explicit color override."
    - type: array
      items:
        $ref: "#/TextSegment"
      minItems: 1
      maxItems: 4
      description: "Array of colored segments (concatenated in display order)."

PolymorphicTextField11x3:
  description: >
    Polymorphic text field bounded to 11 characters and 3 segments. Each bound sits in
    the form it applies to, so a plain string is only measured in characters and a
    segment array only in segments. The character budget is shared by every segment.
  oneOf:
