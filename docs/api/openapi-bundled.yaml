openapi: 3.1.0
info:
  title: ESP32-PixelCast REST API
  version: 0.2.0
  description: |
    REST API for controlling a HUB75 LED matrix panel (64x64) running on ESP32 Trinity. Manages custom apps, notifications, weather, trackers, indicators, icons, and system settings.

    **BREAKING (v0.2.0)**: sleep `sleep_until` / `until` epoch semantics changed from the device's local frame to UTC Unix timestamps. Clients that previously added the device's NTP offset before sending must stop doing so.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: 'http://pixelcast.local/api'
    description: mDNS (default)
  - url: 'http://{deviceIP}/api'
    description: Direct IP
    variables:
      deviceIP:
        default: 192.168.1.100
tags:
  - name: System
    description: 'Device info, settings, brightness, reboot.'
  - name: Apps
    description: Custom app management and rotation.
  - name: Weather
    description: WeatherClock system app.
  - name: Tracker
    description: 'Financial/metric trackers (crypto, stocks).'
  - name: Gauge
    description: Progress-bar dashboards for bounded 0-100% values.
  - name: Notifications
    description: Notification queue management.
  - name: Indicators
    description: Corner indicator LEDs (1-3).
  - name: Icons
    description: Icon filesystem management and LaMetric downloads.
  - name: Sleep
    description: |
      Display sleep mode (schedule-based or manual override). Epoch values are standard UTC Unix timestamps (seconds since 1970-01-01 UTC); the device handles local time display via `ntp.tz_posix`. BREAKING in v0.2.0: previously these epochs were in the device's local frame.
paths:
  /stats:
    get:
      operationId: getStats
      summary: Get system statistics
      tags:
        - System
      responses:
        '200':
          description: System statistics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    description: Firmware version.
                    examples:
                      - 0.1.0-dev
                  uptime:
                    type: integer
                    description: Uptime in seconds.
                  freeHeap:
                    type: integer
                    description: Free heap memory in bytes.
                  maxAllocHeap:
                    type: integer
                    description: Largest allocatable block in bytes.
                  brightness:
                    type: integer
                    description: Current brightness (0-255).
                  wifi:
                    type: object
                    properties:
                      ssid:
                        type: string
                      rssi:
                        type: integer
                        description: Signal strength in dBm.
                      ip:
                        type: string
                        description: Device IP address.
                  display:
                    type: object
                    properties:
                      width:
                        type: integer
                      height:
                        type: integer
                  mqtt:
                    type: object
                    properties:
                      connected:
                        type: boolean
                  apps:
                    type: object
                    properties:
                      count:
                        type: integer
                        description: Number of active apps.
                      current:
                        type: string
                        description: ID of the currently displayed app.
                      rotationEnabled:
                        type: boolean
                  filesystem:
                    type: object
                    properties:
                      ready:
                        type: boolean
                      total:
                        type: integer
                        description: Total filesystem size in bytes.
                      used:
                        type: integer
                        description: Used filesystem space in bytes.
  /settings:
    get:
      operationId: getSettings
      summary: Get current settings
      tags:
        - System
      responses:
        '200':
          description: Current device settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  brightness:
                    type: integer
                    description: Current brightness (0-255).
                  autoRotate:
                    type: boolean
                  defaultDuration:
                    type: integer
                    description: Default duration in milliseconds.
                  weatherDuration:
                    type: integer
                    description: |
                      Display duration of the `weatherclock` app in milliseconds (3000-60000, default 12000).
                  display:
                    type: object
                    properties:
                      width:
                        type: integer
                        description: Panel width in pixels.
                      height:
                        type: integer
                        description: Panel height in pixels.
                  ntp:
                    type: object
                    properties:
                      server:
                        type: string
                        description: NTP server hostname.
                      tz_posix:
                        type: string
                        maxLength: 63
                        description: |
                          POSIX TZ string controlling local time display and DST behaviour. Example: "CET-1CEST,M3.5.0,M10.5.0/3" for Europe/Paris with EU DST. The device does not embed an IANA tz database — clients should convert IANA names (e.g. "Europe/Paris") to POSIX TZ before sending.
                        examples:
                          - 'CET-1CEST,M3.5.0,M10.5.0/3'
                          - UTC0
                          - 'EST5EDT,M3.2.0,M11.1.0'
                        default: 'CET-1CEST,M3.5.0,M10.5.0/3'
                  mqtt:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      prefix:
                        type: string
                        description: MQTT topic prefix.
    post:
      operationId: updateSettings
      summary: Update settings
      description: |
        Partial update: only provided fields are changed.
      tags:
        - System
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Partial update: only provided fields are changed. Omitted fields keep their current values.
              properties:
                brightness:
                  type: integer
                  minimum: 0
                  maximum: 255
                  description: Display brightness (0-255).
                autoRotate:
                  type: boolean
                  description: Enable/disable automatic app rotation.
                defaultDuration:
                  type: integer
                  description: Default app display duration in milliseconds.
                weatherDuration:
                  type: integer
                  minimum: 3000
                  maximum: 60000
                  default: 12000
                  description: |
                    Display duration of the `weatherclock` app in milliseconds. It has its own duration because it runs an internal carousel — an hourly chart page plus the forecast day pages — and splits this time between them, so it needs more of it than a plain app. Applied to the running app immediately, no reboot needed, and persisted across reboots. Bounded to 3000-60000: below 3000 the carousel pages flip faster than they can be read, above 60000 the rotation parks on weather for a full minute.
                ntp:
                  type: object
                  description: |
                    Update NTP source. Either field can be omitted; both are re-applied without reboot via `configTzTime()`.
                  properties:
                    server:
                      type: string
                      description: NTP server hostname.
                    tz_posix:
                      type: string
                      maxLength: 63
                      description: |
                        POSIX TZ string controlling local time display and DST behaviour. Example: "CET-1CEST,M3.5.0,M10.5.0/3" for Europe/Paris with EU DST. The device does not embed an IANA tz database — clients should convert IANA names (e.g. "Europe/Paris") to POSIX TZ before sending.
                      examples:
                        - 'CET-1CEST,M3.5.0,M10.5.0/3'
                        - UTC0
                        - 'EST5EDT,M3.2.0,M11.1.0'
                      default: 'CET-1CEST,M3.5.0,M10.5.0/3'
      responses:
        '200':
          description: Settings updated.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/post/responses/200/content/application~1json/schema'
        '400':
          description: |
            Invalid JSON, or `weatherDuration` outside the 3000-60000 ms range.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/get/responses/400/content/application~1json/schema'
  /brightness:
    post:
      operationId: setBrightness
      summary: Set display brightness
      tags:
        - System
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - brightness
              properties:
                brightness:
                  type: integer
                  minimum: 0
                  maximum: 255
                  description: Brightness value (0-255).
      responses:
        '200':
          description: Brightness updated.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/post/responses/200/content/application~1json/schema'
        '400':
          description: Missing brightness value.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/get/responses/400/content/application~1json/schema'
  /reboot:
    post:
      operationId: reboot
      summary: Reboot device
      description: |
        Triggers a deferred reboot. The response is sent before the device restarts.
      tags:
        - System
      responses:
        '200':
          description: Reboot initiated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  message:
                    type: string
                    examples:
                      - Rebooting...
  /apps:
    get:
      operationId: listApps
      summary: List all apps in rotation
      tags:
        - Apps
      responses:
        '200':
          description: List of active apps.
          content:
            application/json:
              schema:
                type: object
                properties:
                  apps:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: App identifier.
                        text:
                          $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/text'
                        icon:
                          type: string
                        label:
                          $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/text'
                        color:
                          type: string
                          pattern: '^#[0-9a-fA-F]{6}$'
                          description: Default text color as hex string.
                        duration:
                          type: integer
                        staleAfter:
                          $ref: '#/paths/~1gauge/get/responses/200/content/application~1json/schema/properties/staleAfter'
                        staleBehavior:
                          $ref: '#/paths/~1gauge/get/responses/200/content/application~1json/schema/properties/staleBehavior'
                        stale:
                          type: boolean
                          description: Whether the app is currently past its staleAfter window.
                        isSystem:
                          type: boolean
                          description: System apps cannot be deleted via API.
                        isCurrent:
                          type: boolean
                          description: Whether this app is currently being displayed.
                        zoneCount:
                          type: integer
                          description: 'Number of zones (0-1 = single, 2-4 = multi-zone).'
                        zones:
                          type: array
                          items:
                            $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/zones/items'
                          description: Present only when zoneCount >= 2.
                  count:
                    type: integer
                    description: Total number of active apps.
                  currentIndex:
                    type: integer
                    description: Index of the currently displayed app (-1 if none).
                  rotationEnabled:
                    type: boolean
                    description: Whether automatic app rotation is enabled.
  /custom:
    post:
      operationId: createOrUpdateApp
      summary: Create or update a custom app
      description: |
        Supports single-zone (text/icon/color) or multi-zone (zones array) layouts. App name can be in query param or JSON body.
      tags:
        - Apps
      parameters:
        - name: name
          in: query
          schema:
            type: string
          description: App name. Also accepted in JSON body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Create or update a custom app in the rotation. Supports single-zone (text/icon/color) or multi-zone (zones array) layouts.
              properties:
                name:
                  type: string
                  description: |
                    App name (identifier). Can also be passed as `?name=` query parameter.
                text:
                  description: |
                    Text field accepting three formats: plain string, colored string object, or array of colored segments (max 8).
                  oneOf:
                    - type: string
                      description: Plain text (uses default color).
                      examples:
                        - 22.5C
                    - type: object
                      required:
                        - text
                        - color
                      properties:
                        text:
                          type: string
                        color:
                          $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/color'
                      description: Single string with explicit color override.
                      examples:
                        - text: CRITICAL
                          color: '#FF0000'
                    - type: array
                      items:
                        type: object
                        required:
                          - t
                          - c
                        properties:
                          t:
                            type: string
                            description: Text content for this segment.
                          c:
                            $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/color'
                        description: A text fragment with its own color.
                      minItems: 1
                      maxItems: 8
                      description: Array of colored segments (concatenated in display order).
                      examples:
                        - - t: '22.5'
                            c: '#FF8800'
                          - t: C
                            c: '#666666'
                icon:
                  type: string
                  description: Icon name (without extension).
                  examples:
                    - smiley
                label:
                  $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/text'
                color:
                  description: |
                    Color value. Accepts RGB array, hex string, or unsigned 32-bit integer.
                  oneOf:
                    - type: array
                      items:
                        type: integer
                        minimum: 0
                        maximum: 255
                      minItems: 3
                      maxItems: 3
                      description: 'RGB array [R, G, B]'
                      examples:
                        - - 255
                          - 136
                          - 0
                    - type: string
                      pattern: '^#[0-9a-fA-F]{6}$'
                      description: Hex string
                      examples:
                        - '#FF8800'
                    - type: integer
                      minimum: 0
                      maximum: 16777215
                      description: Unsigned 32-bit integer (0xRRGGBB)
                      examples:
                        - 16746496
                duration:
                  type: integer
                  description: Display duration in milliseconds.
                  default: 10000
                  examples:
                    - 10000
                staleAfter:
                  $ref: '#/paths/~1gauge/get/responses/200/content/application~1json/schema/properties/staleAfter'
                  default: 0
                staleBehavior:
                  $ref: '#/paths/~1gauge/get/responses/200/content/application~1json/schema/properties/staleBehavior'
                  default: hide
                lifetime:
                  type: integer
                  deprecated: true
                  description: |
                    Former name of `staleAfter`, still accepted. Up to 1.3.1 the firmware compared this value against milliseconds while documenting seconds, so `3600` expired the app after 3.6 seconds; it is now read as seconds.
                  default: 0
                zones:
                  type: array
                  items:
                    type: object
                    properties:
                      text:
                        $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/text'
                      icon:
                        type: string
                        description: Icon name (without extension) from the device filesystem.
                        examples:
                          - thermo
                      label:
                        $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/text'
                      color:
                        $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/color'
                    description: |
                      A single zone in a multi-zone layout. Full-width zones (>=48px) display icon left + text right. Half-width zones display icon top + text below.
                  minItems: 2
                  maxItems: 4
                  description: |
                    Multi-zone layout. Providing this array switches to dashboard mode. Layout inferred from count: 2 = dual rows, 3 = top + 2 columns, 4 = quad grid. Mutually exclusive with top-level text/icon/label/color.
            examples:
              singleZone:
                summary: Single-zone app
                value:
                  text: Hello World
                  icon: smiley
                  color: '#FF8800'
                  duration: 10000
              multiZone:
                summary: Multi-zone dashboard
                value:
                  zones:
                    - text: 22.5C
                      icon: thermo
                      label: Salon
                      color: '#FF8800'
                    - text: 58%
                      icon: humidity
                      label: Humidity
                      color: '#00D4FF'
                  duration: 10000
              coloredSegments:
                summary: Colored text segments
                value:
                  text:
                    - t: '22.5'
                      c: '#FF8800'
                    - t: C
                      c: '#666666'
                  icon: thermo
      responses:
        '200':
          description: App created or updated.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/post/responses/200/content/application~1json/schema'
        '400':
          description: Missing name or invalid zones array.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/get/responses/400/content/application~1json/schema'
        '500':
          description: Failed to add app (no slot available).
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/get/responses/400/content/application~1json/schema'
    delete:
      operationId: deleteApp
      summary: Delete a custom app
      tags:
        - Apps
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: App name to delete.
      responses:
        '200':
          description: App deleted.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/post/responses/200/content/application~1json/schema'
        '400':
          description: Missing app name.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/get/responses/400/content/application~1json/schema'
        '404':
          description: App not found or is a system app.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/get/responses/400/content/application~1json/schema'
  /weather:
    get:
      operationId: getWeather
      summary: Get current weather data
      tags:
        - Weather
      responses:
        '200':
          description: Weather data (or valid=false if not yet received).
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    description: Whether weather data has been received.
                  age:
                    type: integer
                    description: Seconds since last update.
                  stale:
                    type: boolean
                    description: |
                      True once the silence exceeds `staleAfter`. Unless `staleBehavior` is `none`, the display falls back to the simple clock.
                  staleAfter:
                    $ref: '#/paths/~1gauge/get/responses/200/content/application~1json/schema/properties/staleAfter'
                  staleBehavior:
                    $ref: '#/paths/~1gauge/get/responses/200/content/application~1json/schema/properties/staleBehavior'
                  current:
                    $ref: '#/paths/~1weather/post/requestBody/content/application~1json/schema/properties/current'
                  forecast:
                    type: array
                    items:
                      $ref: '#/paths/~1weather/post/requestBody/content/application~1json/schema/properties/forecast/items'
                  today:
                    $ref: '#/paths/~1weather/post/requestBody/content/application~1json/schema/properties/today'
    post:
      operationId: updateWeather
      summary: Update weather data
      description: |
        Push current conditions, an optional 7-day forecast and an optional hourly window. The WeatherClock system app displays all three: the current conditions on top, then a carousel whose first page is the hourly chart, when a payload carries one, followed by the forecast days. It falls back to a simple clock when data is stale (>1 hour).
      tags:
        - Weather
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current
              properties:
                current:
                  type: object
                  required:
                    - icon
                    - temp
                  properties:
                    icon:
                      type: string
                      description: |
                        Weather icon name. Use one of the built-in icons below, or any icon uploaded to the device filesystem.

                        **Built-in weather icons** (8x8, stored in PROGMEM):
                        | Name | Description | |------|-------------| | `w_clear_day` | Sunny | | `w_clear_night` | Clear night | | `w_partly_day` | Partly cloudy (day) | | `w_partly_night` | Partly cloudy (night) | | `w_cloudy` | Cloudy | | `w_rain` | Rain | | `w_heavy_rain` | Heavy rain | | `w_thunder` | Thunderstorm | | `w_snow` | Snow | | `w_fog` | Fog |
                      examples:
                        - w_clear_day
                    temp:
                      type: integer
                      description: Current temperature.
                    temp_min:
                      type: integer
                      description: Today's minimum temperature.
                    temp_max:
                      type: integer
                      description: Today's maximum temperature.
                    humidity:
                      type: integer
                      minimum: 0
                      maximum: 100
                      description: Humidity percentage.
                forecast:
                  type: array
                  items:
                    type: object
                    required:
                      - day
                      - icon
                      - temp_min
                      - temp_max
                    properties:
                      day:
                        type: string
                        maxLength: 3
                        description: 'Day abbreviation (3 chars, e.g. "LUN", "MON").'
                        examples:
                          - LUN
                      icon:
                        type: string
                        description: |
                          Weather icon name. Built-in PROGMEM icons: w_clear_day, w_clear_night, w_partly_day, w_partly_night, w_cloudy, w_rain, w_heavy_rain, w_thunder, w_snow, w_fog. Filesystem icons also accepted.
                        examples:
                          - w_rain
                      temp_min:
                        type: integer
                        description: Minimum temperature.
                      temp_max:
                        type: integer
                        description: Maximum temperature.
                  maxItems: 7
                  description: |
                    Forecast days, displayed in pages of 3 columns with automatic scrolling. Page timing is proportional to app duration.

                    Start at tomorrow, not today: today's minimum and maximum are already on screen at all times as `current.temp_min` and `current.temp_max`, so a column for today would repeat them.

                    The carousel is capped at 3 pages, which bounds how many days are actually shown. Sending `today` spends the first page on the hourly chart, leaving 6 days; without it, 9 days would fit but `maxItems` caps the array at 7. Days beyond what the carousel can show are stored and echoed back, but never displayed.
                today:
                  type: object
                  description: |
                    Hourly window charted on the first carousel page of the WeatherClock app: a temperature curve over the precipitation bars. Hours are absolute local hours and are displayed as received, so the sender decides where the window starts. The numbers framing the curve are the temperatures of the first and last charted hours. The page appears on the first payload carrying a non-empty hours array. The segments array is stored and echoed back but is not currently drawn.
                  properties:
                    hours:
                      type: array
                      items:
                        type: object
                        required:
                          - h
                          - temp
                        properties:
                          h:
                            type: integer
                            minimum: 0
                            maximum: 23
                            description: Local hour of the day.
                            examples:
                              - 15
                          temp:
                            type: integer
                            minimum: -100
                            maximum: 100
                            description: |
                              Temperature for that hour, same unit as the current conditions. Values outside the range are clamped to it.
                          pop:
                            type: integer
                            minimum: 0
                            maximum: 100
                            description: 'Precipitation probability, in percent.'
                          precip:
                            type: integer
                            minimum: 0
                            maximum: 255
                            description: Precipitation quantity in tenths of a millimetre (2 means 0.2 mm).
                      maxItems: 12
                      description: Hourly values (up to 12). Extra entries are ignored.
                    segments:
                      type: array
                      items:
                        type: object
                        required:
                          - from
                          - to
                          - icon
                        properties:
                          from:
                            type: integer
                            minimum: 0
                            maximum: 23
                            description: First local hour of the segment (inclusive).
                          to:
                            type: integer
                            minimum: 0
                            maximum: 23
                            description: Last local hour of the segment (inclusive).
                          icon:
                            type: string
                            maxLength: 31
                            description: |
                              Weather icon name for the whole segment. Built-in PROGMEM icons: w_clear_day, w_clear_night, w_partly_day, w_partly_night, w_cloudy, w_rain, w_heavy_rain, w_thunder, w_snow, w_fog. Longer names are truncated to 31 characters.
                            examples:
                              - w_partly_day
                      maxItems: 4
                      description: |
                        Sky segments covering the window (up to 4). Extra entries are ignored. Segments are computed by the sender; they are stored and echoed back but are not currently drawn.
                staleAfter:
                  $ref: '#/paths/~1gauge/get/responses/200/content/application~1json/schema/properties/staleAfter'
                  default: 3600
                staleBehavior:
                  allOf:
                    - $ref: '#/paths/~1gauge/get/responses/200/content/application~1json/schema/properties/staleBehavior'
                  enum:
                    - hide
                    - none
                  default: hide
                  description: |
                    A forecast that stopped being refreshed turns wrong rather than merely old, so `hide` falls back to the clock. `none` keeps showing the last forecast. `dim` and `badge` belong to the tracker layout and are rejected here with HTTP 400.
            examples:
              threeDayForecast:
                summary: Current + 3-day forecast + hourly window
                value:
                  current:
                    icon: w_clear_day
                    temp: 22
                    temp_min: 16
                    temp_max: 29
                    humidity: 50
                  forecast:
                    - day: MON
                      icon: w_partly_day
                      temp_min: 14
                      temp_max: 23
                    - day: TUE
                      icon: w_rain
                      temp_min: 10
                      temp_max: 17
                    - day: WED
                      icon: w_snow
                      temp_min: -2
                      temp_max: 3
                  today:
                    hours:
                      - h: 15
                        temp: 22
                        pop: 0
                        precip: 0
                      - h: 16
                        temp: 23
                        pop: 10
                        precip: 2
                      - h: 17
                        temp: 23
                        pop: 40
                        precip: 8
                      - h: 18
                        temp: 21
                        pop: 80
                        precip: 25
                      - h: 19
                        temp: 19
                        pop: 30
                        precip: 4
                      - h: 20
                        temp: 18
                        pop: 10
                        precip: 0
                    segments:
                      - from: 15
                        to: 16
                        icon: w_partly_day
                      - from: 17
                        to: 19
                        icon: w_rain
                      - from: 20
                        to: 20
                        icon: w_clear_night
      responses:
        '200':
          description: Weather data updated.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/post/responses/200/content/application~1json/schema'
        '400':
          description: Missing `current` object.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/get/responses/400/content/application~1json/schema'
  /trackers:
