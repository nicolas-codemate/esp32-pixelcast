                    description: >
                      Color value. Accepts RGB array, hex string, or unsigned
                      32-bit integer.
                    oneOf:
                      - type: array
                        items:
                          type: integer
                          minimum: 0
                          maximum: 255
                        minItems: 3
                        maxItems: 3
                        description: RGB array [R, G, B]
                        examples:
                          - - 255
                            - 136
                            - 0
                      - type: string
                        pattern: ^#[0-9a-fA-F]{6}$
                        description: Hex string
                        examples:
                          - '#FF8800'
                      - type: integer
                        minimum: 0
                        maximum: 16777215
                        description: Unsigned 32-bit integer (0xRRGGBB)
                        examples:
                          - 16746496
                description: Single string with explicit color override.
              - type: array
