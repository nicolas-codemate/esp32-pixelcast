# Notification schemas

NotificationRequest:
  type: object
  required: [text]
  properties:
    text:
      allOf:
        - $ref: "common.yaml#/PolymorphicTextField"
      maxLength: 128
      maxItems: 8
      description: >
        Notification text, required. Accepts the three forms of a colored text field -
        plain string, single colored string, or up to eight colored segments concatenated
        in display order. Segments color the text and nothing else: the two separator lines
        keep the color they already had, and `color` still colors any text sent without a
        color of its own.
        A text that ends up empty is refused with HTTP 400 `Missing text`, and that covers
        `""`, `{"text": ""}` and `[]` alike; over MQTT the message is dropped with a serial
        log. Accents are shown as their closest ASCII letter, and since segment boundaries
        are counted in bytes but applied glyph by glyph, a boundary that comes after an
        accented character or a degree sign in the same string is applied one glyph late
        for each of them.
      examples:
        - "Build passed"
        - - t: "Build "
            c: "#FFFFFF"
          - t: "failed"
            c: "#FF0000"
    id:
      type: string
      description: >
        Optional unique ID. If omitted, auto-generated as `notif_<millis>`.
    icon:
      type: string
      description: Icon name (without extension).
    color:
      allOf:
        - $ref: "common.yaml#/Color"
      default: "#FFFFFF"
      description: >
        Two roles. It is the color the text takes wherever `text` carries none of its own,
        and it paints the two separator lines - unless `background` is set, which takes the
        lines over. A `text` written entirely in segments therefore still needs `color` set
        if the lines are meant to match it.
    background:
      $ref: "common.yaml#/Color"
    duration:
      type: integer
      description: Display duration in milliseconds.
      default: 5000
    hold:
      type: boolean
      description: >
        Hold notification until explicitly dismissed. Overrides duration.
      default: false
    urgent:
      type: boolean
      description: Jump to front of notification queue.
      default: false
    stack:
      type: boolean
      description: >
        Queue sequentially with other notifications (true) vs replace
        current notification (false).
      default: true

NotificationResponse:
  type: object
  properties:
    success:
      type: boolean
      const: true
    id:
      type: string
      description: The assigned notification ID.

NotificationItem:
  type: object
  properties:
    id:
      type: string
    text:
      allOf:
        - $ref: "common.yaml#/PolymorphicTextField"
      description: >
        Echoed in the form it was stored: a plain string unless the notification was sent
        with color segments, in which case it comes back as the segment array.
    icon:
      type: string
    duration:
      type: integer
    hold:
      type: boolean
    urgent:
      type: boolean
    stack:
      type: boolean
    displayed:
      type: boolean
      description: Whether this notification has been shown at least once.
    current:
      type: boolean
      description: Whether this is the currently displayed notification.

NotificationListResponse:
  type: object
  properties:
    count:
      type: integer
      description: Number of active notifications.
    currentIndex:
      type: integer
      description: Index of the currently displayed notification.
    notifications:
      type: array
      items:
        $ref: "#/NotificationItem"
