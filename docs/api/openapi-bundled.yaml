        '400':
          description: Missing gauge name.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/get/responses/400/content/application~1json/schema'
        '404':
          description: Gauge not found.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/get/responses/400/content/application~1json/schema'
  /sleep:
    get:
      operationId: getSleep
      summary: Get sleep state and configuration
      description: |
        Returns the current sleep state (active or not, reason, override expiry) and the full sleep configuration snapshot.
      tags:
        - Sleep
      responses:
        '200':
          description: Current sleep state and configuration.
          content:
            application/json:
              schema:
                type: object
                required:
                  - sleeping
                  - config
                description: Current sleep state plus full configuration snapshot.
                properties:
                  sleeping:
                    type: boolean
                    description: True when the device is currently in a sleep state.
                  reason:
                    type: string
                    enum:
                      - schedule
                      - override
                      - ntp_not_synced
                    description: |
                      Why the device is in its current state. Present when `sleeping` is true, AND when `sleeping` is false because NTP is not yet synced (fail-open: an unreliable clock takes precedence over the schedule so the device stays awake while still surfacing the diagnostic). Values: `schedule` = matched a weekly slot; `override` = `sleep_until` is in the future; `ntp_not_synced` = NTP time not acquired. Omitted otherwise (device awake under normal conditions).
                  until:
                    type: integer
                    minimum: 0
                    description: |
                      UTC Unix timestamp at which the override expires. Only present when `reason` is `override`.
                    examples:
                      - 4102444800
                  config:
                    $ref: '#/paths/~1sleep/post/requestBody/content/application~1json/schema'
              examples:
                awake:
                  summary: Device is awake
                  value:
                    sleeping: false
                    config:
                      enabled: true
                      display_mode: black
                      schedule:
                        monday:
                          all_day: false
                          slots:
                            - start: '20:00'
                              end: '07:00'
                      sleep_until: 0
                overrideActive:
                  summary: Manual override active
                  value:
                    sleeping: true
                    reason: override
                    until: 4102444800
                    config:
                      enabled: true
                      display_mode: clock
                      schedule: {}
                      sleep_until: 4102444800
                scheduleActive:
                  summary: Sleeping because the weekly schedule matches now
                  value:
                    sleeping: true
                    reason: schedule
                    config:
                      enabled: true
                      display_mode: black
                      schedule:
                        monday:
                          all_day: false
                          slots:
                            - start: '20:00'
                              end: '07:00'
                      sleep_until: 0
                ntpNotSynced:
                  summary: 'NTP not yet synced (fail-open, schedule not evaluated)'
                  value:
                    sleeping: false
                    reason: ntp_not_synced
                    config:
                      enabled: true
                      display_mode: black
                      schedule: {}
                      sleep_until: 0
    post:
      operationId: updateSleep
      summary: Update sleep configuration (partial)
      description: |
        Partial update of the sleep configuration. Only provided fields are changed; omitted fields are left untouched. Rejected payloads do not partially mutate state (atomic apply).

        Validation errors returned as `400` with `{"error": "<message>"}` include: `Invalid JSON`, `Invalid display_mode`, `sleep_until is in the past`, `Unknown day: <name>`, `Invalid time format`, `Too many slots`.
      tags:
        - Sleep
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Sleep configuration. All fields are optional: `POST /api/sleep` performs a partial update and only changes the fields that are present.
              properties:
                enabled:
                  type: boolean
                  description: Master toggle for the schedule-based sleep.
                display_mode:
                  type: string
                  enum:
                    - black
                    - clock
                  description: |
                    What to render while the device is sleeping. `black` blanks the panel; `clock` shows a dimmed clock.
                schedule:
                  type: object
                  description: |
                    Weekly sleep schedule keyed by lowercase day name. All day keys are optional in partial updates.
                  properties:
                    monday:
                      type: object
                      description: |
                        Sleep configuration for a single day of the week. Fields are optional in partial updates: omitted fields leave the corresponding day untouched.
                      properties:
                        all_day:
                          type: boolean
                          description: |
                            When true, the device is considered asleep for the entire day and `slots` is ignored.
                        slots:
                          type: array
                          maxItems: 2
                          items:
                            type: object
                            required:
                              - start
                              - end
                            properties:
                              start:
                                type: string
                                pattern: '^[0-2][0-9]:[0-5][0-9]$'
                                description: |
                                  Start time in 24h `HH:MM` format (zero-padded). See `end` for the rule that lets a slot wrap past midnight (`end < start`).
                                examples:
                                  - '20:00'
                              end:
                                type: string
                                pattern: '^[0-2][0-9]:[0-5][0-9]$'
                                description: |
                                  End time in 24h `HH:MM` format (zero-padded). When `end` is less than `start`, the slot wraps past midnight into the following day (e.g. `start=20:00`, `end=07:00` means 20:00 tonight through 07:00 tomorrow).
                                examples:
                                  - '07:00'
                          description: |
                            Up to 2 sleep windows for this day. A slot with `end < start` wraps past midnight into the next day.
                    tuesday:
                      $ref: '#/paths/~1sleep/post/requestBody/content/application~1json/schema/properties/schedule/properties/monday'
                    wednesday:
                      $ref: '#/paths/~1sleep/post/requestBody/content/application~1json/schema/properties/schedule/properties/monday'
                    thursday:
                      $ref: '#/paths/~1sleep/post/requestBody/content/application~1json/schema/properties/schedule/properties/monday'
                    friday:
                      $ref: '#/paths/~1sleep/post/requestBody/content/application~1json/schema/properties/schedule/properties/monday'
                    saturday:
                      $ref: '#/paths/~1sleep/post/requestBody/content/application~1json/schema/properties/schedule/properties/monday'
                    sunday:
                      $ref: '#/paths/~1sleep/post/requestBody/content/application~1json/schema/properties/schedule/properties/monday'
                  additionalProperties: false
                sleep_until:
                  type: integer
                  minimum: 0
                  description: |
                    Manual sleep override expressed as a UTC Unix timestamp (seconds since 1970-01-01 UTC). When non-zero and in the future, the device sleeps regardless of `schedule`. A value of `0` clears any active override.
                  examples:
                    - 4102444800
            examples:
              enableSchedule:
                summary: Enable schedule with one weeknight slot
                value:
                  enabled: true
                  display_mode: black
                  schedule:
                    monday:
                      all_day: false
                      slots:
                        - start: '20:00'
                          end: '07:00'
              setOverride:
                summary: Manual override (sleep until epoch)
                value:
                  sleep_until: 4102444800
              clearOverride:
                summary: Clear manual override
                value:
                  sleep_until: 0
      responses:
        '200':
          description: Sleep configuration updated.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/post/responses/200/content/application~1json/schema'
        '400':
          description: Invalid payload (see description for full error list).
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/get/responses/400/content/application~1json/schema'
  /sleep/wake:
    post:
      operationId: wake
      summary: Clear sleep override
      description: |
        Clears any active `sleep_until` override and wakes the device immediately. Equivalent to `POST /api/sleep` with `{"sleep_until": 0}`. Schedule-based sleep is not affected.
      tags:
        - Sleep
      responses:
        '200':
          description: Override cleared.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/post/responses/200/content/application~1json/schema'
  /notify:
    post:
      operationId: sendNotification
      summary: Send a notification
      description: |
        Push a notification to the display. Notifications interrupt app rotation and are displayed with a card frame overlay.
      tags:
        - Notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  allOf:
                    - $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/text'
                  maxLength: 128
                  maxItems: 8
                  description: |
                    Notification text, required. Accepts the three forms of a colored text field - plain string, single colored string, or up to eight colored segments concatenated in display order. Segments color the text and nothing else: the two separator lines keep the color they already had, and `color` still colors any text sent without a color of its own. A text that ends up empty is refused with HTTP 400 `Missing text`, and that covers `""`, `{"text": ""}` and `[]` alike; over MQTT the message is dropped with a serial log. Accents are shown as their closest ASCII letter, and since segment boundaries are counted in bytes but applied glyph by glyph, a boundary that comes after an accented character or a degree sign in the same string is applied one glyph late for each of them.
                  examples:
                    - Build passed
                    - - t: 'Build '
                        c: '#FFFFFF'
                      - t: failed
                        c: '#FF0000'
                id:
                  type: string
                  description: |
                    Optional unique ID. If omitted, auto-generated as `notif_<millis>`.
                icon:
                  type: string
                  description: Icon name (without extension).
                color:
                  allOf:
                    - $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/color'
                  default: '#FFFFFF'
                  description: |
                    Two roles. It is the color the text takes wherever `text` carries none of its own, and it paints the two separator lines - unless `background` is set, which takes the lines over. A `text` written entirely in segments therefore still needs `color` set if the lines are meant to match it.
                background:
                  $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/color'
                duration:
                  type: integer
                  description: Display duration in milliseconds.
                  default: 5000
                hold:
                  type: boolean
                  description: |
                    Hold notification until explicitly dismissed. Overrides duration.
                  default: false
                urgent:
                  type: boolean
                  description: Jump to front of notification queue.
                  default: false
                stack:
                  type: boolean
                  description: |
                    Queue sequentially with other notifications (true) vs replace current notification (false).
                  default: true
            examples:
              simple:
                summary: Simple notification
                value:
                  text: New message!
                  icon: mail
                  color: '#0096FF'
                  duration: 5000
              urgent:
                summary: Urgent notification
                value:
                  text: Alert!
                  icon: warning
                  color: '#FF0000'
                  urgent: true
                  hold: true
      responses:
        '200':
          description: Notification queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  id:
                    type: string
                    description: The assigned notification ID.
        '400':
          description: Missing text or invalid JSON.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/get/responses/400/content/application~1json/schema'
        '503':
          description: Notification queue full.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/get/responses/400/content/application~1json/schema'
  /notify/list:
    get:
      operationId: listNotifications
      summary: List active notifications
      tags:
        - Notifications
      responses:
        '200':
          description: Active notification queue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Number of active notifications.
                  currentIndex:
                    type: integer
                    description: Index of the currently displayed notification.
                  notifications:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        text:
                          allOf:
                            - $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/text'
                          description: |
                            Echoed in the form it was stored: a plain string unless the notification was sent with color segments, in which case it comes back as the segment array.
                        icon:
                          type: string
                        duration:
                          type: integer
                        hold:
                          type: boolean
                        urgent:
                          type: boolean
                        stack:
                          type: boolean
                        displayed:
                          type: boolean
                          description: Whether this notification has been shown at least once.
                        current:
                          type: boolean
                          description: Whether this is the currently displayed notification.
  /notify/dismiss:
    post:
      operationId: dismissNotification
      summary: Dismiss current notification
      tags:
        - Notifications
      responses:
        '200':
          description: Notification dismissed.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/post/responses/200/content/application~1json/schema'
        '404':
          description: No active notification.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/get/responses/400/content/application~1json/schema'
  /indicator1:
    post:
      operationId: setIndicator1
      summary: Set indicator 1
      tags:
        - Indicators
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                    - solid
                    - blink
                    - fade
                    - 'off'
                  description: |
                    Indicator mode. If omitted but `color` is provided, defaults to `solid`. Use `off` to turn off the indicator.
                color:
                  $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/color'
                blinkInterval:
                  type: integer
                  description: Blink interval in milliseconds (only for `blink` mode).
                  default: 500
                fadePeriod:
                  type: integer
                  description: Fade cycle period in milliseconds (only for `fade` mode).
                  default: 2000
            examples:
              solidRed:
                summary: Solid red
                value:
                  mode: solid
                  color: '#FF0000'
              blinkGreen:
                summary: Blinking green
                value:
                  mode: blink
                  color: '#00FF00'
                  blinkInterval: 500
      responses:
        '200':
          description: Indicator set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  indicator:
                    type: integer
                    description: Indicator index (1-3).
                  mode:
                    type: string
                    enum:
                      - solid
                      - blink
                      - fade
                      - 'off'
                  color:
                    type: string
                    pattern: '^#[0-9a-fA-F]{6}$'
                    description: Hex color string.
                    examples:
                      - '#FF0000'
        '400':
          description: Invalid mode.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/get/responses/400/content/application~1json/schema'
    delete:
