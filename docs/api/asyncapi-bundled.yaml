                    default: 0
                    description: >
                      Bar fill, clamped to 0-100 on parse. The only number the
                      firmware interprets; everything else on the row is text it
                      prints untouched. The fill is rounded to the nearest pixel
                      with a floor of one, so any percentage above zero lights
                      at least one pixel and only 0% leaves the bar empty. The
                      fill spans the 58 pixels inside a full-width bar, 36
                      inside a bar shortened by a note.
                    examples:
                      - 41
                  color:
                    default: '#FFFFFF'
                    description: >
                      Color value. Accepts RGB array, hex string, or unsigned
                      32-bit integer.
                    oneOf:
                      - type: array
                        items:
                          type: integer
                          minimum: 0
                          maximum: 255
                        minItems: 3
                        maxItems: 3
                        description: RGB array [R, G, B]
                        examples:
                          - - 255
                            - 136
                            - 0
                      - type: string
                        pattern: ^#[0-9a-fA-F]{6}$
                        description: Hex string
                        examples:
                          - '#FF8800'
                      - type: integer
                        minimum: 0
                        maximum: 16777215
                        description: Unsigned 32-bit integer (0xRRGGBB)
                        examples:
                          - 16746496
                  noteColor:
                    default: '#969696'
                    description: >
                      Color value. Accepts RGB array, hex string, or unsigned
                      32-bit integer.
                    oneOf:
                      - type: array
                        items:
                          type: integer
                          minimum: 0
                          maximum: 255
                        minItems: 3
                        maxItems: 3
                        description: RGB array [R, G, B]
                        examples:
                          - - 255
                            - 136
                            - 0
                      - type: string
                        pattern: ^#[0-9a-fA-F]{6}$
                        description: Hex string
                        examples:
                          - '#FF8800'
                      - type: integer
                        minimum: 0
                        maximum: 16777215
                        description: Unsigned 32-bit integer (0xRRGGBB)
                        examples:
                          - 16746496
              maxItems: 9
              description: >
                Rows to display, three per page. Beyond three rows the panel
                paginates on its own, one dot per page at the bottom, each page
                holding the screen for the app duration divided by the page
                count - so the carousel never lengthens the rotation. A last
                page holding one or two rows is centred vertically in the band
                the three would have filled. More than nine rows is refused
                whole with HTTP 400 and the gauge keeps the rows it had.
            duration:
              type: integer
              description: >-
                Display duration in milliseconds, split evenly across the
                carousel pages.
              default: 10000
            staleAfter:
              default: 3600
              type: integer
              minimum: 0
              maximum: 604800
              description: >
                Silence tolerated before the app is considered stale, in
                seconds. 0 = never. The firmware cannot know when your data is
                due, so declare your own push interval plus a margin: a client
                pushing every 30 minutes sets 5400. Values above 604800 (7 days)
                are clamped.
              examples:
                - 5400
            staleBehavior:
              default: dim
              type: string
              enum:
                - hide
                - dim
                - badge
                - none
              description: >
                What the app does once stale. `hide` leaves the rotation until
                the client pushes again, `dim` stays visible dimmed with a STALE
                badge, `badge` stays visible at full colour with the badge,
                `none` shows no sign at all. `dim` and `badge` are only rendered
                by the tracker and gauge layouts; sending them to another
                endpoint is rejected with HTTP 400.
              examples:
                - badge
        description: >
          Same payload as `POST /api/gauge`, except that a name over fifteen
          characters and an oversized `rows` array are dropped with a serial log
          instead of an HTTP 400, and an unknown `staleBehavior` falls back to
          `dim` instead of being rejected. Watch the payload size: the MQTT
          receive buffer is 2048 bytes (`MQTT_BUFFER_SIZE`) and nine rows come
          close to 1.3 KB, so a broker message longer than the buffer is dropped
          before the firmware ever parses it. Coloring a `title` or a `label`
          costs around 30 bytes a segment - `[{"t":"5h","c":"#FFFFFF"},{"t":"
          reset","c":"#888888"}]` against `"5h reset"` - which a nine-row gauge
          cannot afford: keep the labels plain over MQTT on a full gauge, or
          split the push into fewer rows per message. REST has no such ceiling.
        examples:
          - name: claudeLimits
            summary: Subscription limits, four rows over two pages
            payload:
              title: Claude
              icon: claude
              duration: 10000
              staleAfter: 2700
              staleBehavior: dim
              rows:
                - label: 5h
                  info: '14:50'
                  value: 41%
                  percent: 41
                  color: '#4CAF50'
                  note: x1.2^
                  noteColor: '#FFC107'
                - label: 7j
                  info: 15/08 17h
                  value: 28%
                  percent: 28
                  color: '#4CAF50'
                  note: x1.1>
                  noteColor: '#4CAF50'
                - label: fable
                  value: 3%
                  percent: 3
                  color: '#4CAF50'
                - label: credits
                  value: 1%
                  percent: 1
                  color: '#4CAF50'
          - name: diskUsage
            summary: Disk fill levels, no info and no note, bars at full width
            payload:
              title: Disques
              icon: disk
              rows:
                - label: root
                  value: 62%
                  percent: 62
                  color: '#4CAF50'
                - label: data
                  value: 88%
                  percent: 88
                  color: '#FFC107'
                - label: backup
                  value: 97%
                  percent: 97
                  color: '#F44336'
          - name: coloredLabels
            summary: Two-color title and labels split between a window and its reset
            payload:
              title:
                - t: 'Claude '
                  c: '#FFFFFF'
                - t: Max
                  c: '#D97757'
              icon: claude
              rows:
                - label:
                    - t: 5h
                      c: '#FFFFFF'
                    - t: ' reset'
                      c: '#888888'
                  value: 41%
                  percent: 41
                  color: '#4CAF50'
                - label:
                    - t: 7j
                      c: '#FFFFFF'
                    - t: ' reset'
                      c: '#888888'
                  value: 28%
                  percent: 28
                  color: '#4CAF50'
          - name: deleteGauge
            summary: Delete a gauge
            payload:
              delete: true
  reboot:
    address: '{prefix}/reboot'
    description: Reboot the device. Payload can be empty.
    parameters:
      prefix:
        default: pixelcast
    messages:
      rebootMessage:
        payload:
          type: 'null'
        description: Empty payload (or any payload - ignored).
  sleep:
    address: '{prefix}/sleep'
    description: >
      Set a manual sleep override. Payload is `{"until": <epoch>}` where the
      epoch is a UTC Unix timestamp (seconds since 1970-01-01 UTC). Equivalent
      to the REST call `POST /api/sleep` with `{"sleep_until": <epoch>}`. Past
      values are rejected (logged to serial; state unchanged).
    parameters:
      prefix:
        default: pixelcast
    messages:
      sleepOverrideMessage:
        payload:
          type: object
          required:
            - until
          properties:
            until:
              type: integer
              minimum: 0
              description: >
                UTC Unix timestamp when the override expires (seconds since
                1970-01-01 UTC). Past values are rejected.
              examples:
                - 4102444800
        examples:
          - name: oneHourOverride
            summary: Sleep until a specific epoch
            payload:
              until: 4102444800
  wake:
    address: '{prefix}/wake'
    description: >
      Clear the manual sleep override and wake the device immediately. Payload
      can be empty. Equivalent to `POST /api/sleep/wake`.
    parameters:
      prefix:
        default: pixelcast
    messages:
      wakeMessage:
        payload:
          type: 'null'
        description: >
          Wake-now command. Payload is ignored. Clears the active sleep
          override; schedule-based sleep is not affected.
  status:
    address: '{prefix}/status'
    description: >
      Connection status (LWT). Published as retained. "online" on connect,
      "offline" as Last Will on disconnect.
    parameters:
      prefix:
        default: pixelcast
    messages:
      statusMessage:
        payload:
          type: string
          enum:
            - online
            - offline
        examples:
          - name: online
            payload: online
          - name: offline
            payload: offline
  stats:
    address: '{prefix}/stats'
    description: |
      System statistics published every 60 seconds. Not retained.
    parameters:
      prefix:
        default: pixelcast
    messages:
      statsMessage:
        payload:
          type: object
          description: Compact stats payload published over MQTT every 60 seconds.
          properties:
            uptime:
              type: integer
            freeHeap:
              type: integer
            brightness:
              type: integer
            rssi:
              type: integer
            appCount:
              type: integer
            version:
              type: string
            currentApp:
              type: string
        examples:
          - name: stats
            payload:
              uptime: 3600
              freeHeap: 120000
              brightness: 128
              rssi: -45
              appCount: 3
              version: 0.1.0-dev
              currentApp: weather_clock
