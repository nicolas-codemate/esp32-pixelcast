# Tracker schemas

TrackerUpdateRequest:
  type: object
  properties:
    name:
      type: string
      description: >
        Tracker identifier. Can also be passed as `?name=` query parameter.
    symbol:
      type: string
      maxLength: 31
      description: >
        Headline shown on the top row (e.g. "BTC", "Amundi PEA Monde"). Longer than the
        row is wide is fine: the display scrolls it, pausing at each end. The row holds
        eight characters beside an icon and ten without one, since a tracker with no
        `icon` gives its headline the full width. The panel has
        no accented glyphs, so Latin-1 accents are shown as their closest ASCII letter -
        "Santé" reads "Sante". Anything else outside ASCII is dropped: "Cœur" reads
        "Cur", and a typographic apostrophe disappears.
      examples:
        - "BTC"
        - "Amundi PEA Monde"
    icon:
      type: string
      description: Icon name from filesystem.
      examples:
        - "bitcoin"
    currency:
      type: string
      maxLength: 7
      description: Currency label (e.g. "USD", "EUR").
      examples:
        - "USD"
    value:
      type: number
      format: float
      description: >
        Current price/value. The panel shows as many decimals as fit the value row,
        which the currency label shortens when one is set. Two decimals are always
        shown when they fit, so 128.4 reads 128.40 and 6.232 keeps its third decimal.
        Digits beyond the seven a float can carry are dropped rather than printed as
        rounding noise.
      examples:
        - 98452.30
    change:
      type: number
      format: float
      description: Change percentage (positive or negative).
      examples:
        - 2.14
    sparkline:
      type: array
      items:
        type: number
        format: float
      maxItems: 63
      description: >
        Price series for the chart. The chart is 63 columns wide and plots one point per
        column, so 63 points are drawn as sent and a shorter series is stretched across the
        same columns, keeping its shape and both its endpoints. It is 20 rows tall, or 32 when
        the tracker sends no `bottomText`. Values are auto-scaled to fit the chart area
        (min/max normalization to uint16 0-65535); a series that never moves is drawn along
        the middle of the chart rather than along its floor. The curve is green above the
        reference line and red below it - see `sparklineRef`. Over MQTT the whole payload has
        to fit the 2 KB broker buffer, which a 63-point series plus 63 volumes fills at about
        1.5 KB; the REST endpoint accepts up to 16 KB.
      examples:
        - [92100, 89300, 93200, 91800, 95400, 94100, 97600, 96200, 98452]
    volumes:
      type: array
      items:
        type: number
        format: float
      maxItems: 63
      description: >
        Optional volume series, drawn as midnight blue bars behind the curve. It keeps its
        own length and is stretched over the 63 columns like `sparkline`, taking the nearest
        point rather than interpolating. It is scaled against its own largest value, not
        between its extremes, so a bar is read from zero. Bars are at least one pixel tall and
        at most three fifths of the chart. Omit the field to leave the chart without bars.
      examples:
        - [3.2, 4.1, 3.8, 5.6, 4.9, 6.2, 5.1, 4.4, 6.0]
    sparklineRef:
      type: string
      enum: [open, last]
      default: open
      description: >
        Which price the chart compares every column against. `open` (the default) takes the
        first point of the series, so green means "up since the period opened". `last` takes
        the final point, so green means "the price was higher then than it is now" - which
        turns a rising week mostly red, the opposite of the usual reading. Both ends are
        marked: the reference is a dashed line every other pixel, the other end a darker
        dashed line, hidden when the two ends land within a pixel of each other.
    symbolColor:
      allOf:
        - $ref: "common.yaml#/Color"
      default: "#00DC3C"
      description: Headline color on the top row. Defaults to the green of the tracker screen.
    sparklineColor:
      allOf:
        - $ref: "common.yaml#/Color"
      deprecated: true
      description: >
        No longer drawn. The curve takes its two colors from its position against
        `sparklineRef`. Still accepted and echoed back so existing clients keep working.
    bottomText:
      allOf:
        - $ref: "common.yaml#/PolymorphicTextField"
      maxLength: 31
      description: >
        Optional footer text on the bottom row, in the same font as the price: ten characters
        fit, and anything longer scrolls, pausing at each end. Leaving it out hands its rows,
        and those of the separator above it, to the chart, which grows from 20 rows to 32.
        Accepts the same three forms as a custom app's text: plain string, single colored
        string, or colored segments - `maxLength` bounds the plain form, and the other two
        are cut at the same 31 characters, a segment that no longer fits being dropped whole.
        Accents are transliterated as they are in `symbol`, and the degree sign is dropped.
        A tracker left on the default `staleBehavior` of `dim` dims these colors along with
        the rest of the screen.
      examples:
        - "ATH 73.6K 03/24"
        - [{"t": "Vol ", "c": "#888888"}, {"t": "42B", "c": "#00D4FF"}]
    sparklinePeriod:
      type: string
      maxLength: 4
      default: "24h"
      description: >
        Period covered by the sparkline series, set into the rule above the chart, which
        stops short of it. Two characters read best - "7D", "1M", "3M", "1Y" - a longer
        label only shortens the rule. Send an empty string to hide it and run the rule the
        full width.
      examples:
        - "7D"
    duration:
      type: integer
      description: Display duration in milliseconds.
      default: 10000
    staleAfter:
      $ref: "common.yaml#/StaleAfter"
      default: 3600
    staleBehavior:
      $ref: "common.yaml#/StaleBehavior"
      default: dim

TrackerResponse:
  type: object
  properties:
    name:
      type: string
    symbol:
      type: string
    icon:
      type: string
    currency:
      type: string
    value:
      type: number
      format: float
    change:
      type: number
      format: float
    symbolColor:
      type: string
      pattern: "^#[0-9a-fA-F]{6}$"
      description: Hex color string.
      examples:
        - "#FF8800"
    sparklineColor:
      type: string
      pattern: "^#[0-9a-fA-F]{6}$"
      deprecated: true
      description: Hex color string. Stored and echoed, but no longer drawn.
      examples:
        - "#00D4FF"
    bottomText:
      allOf:
        - $ref: "common.yaml#/PolymorphicTextField"
      description: >
        Echoed in the form it was stored: a plain string unless the value was written with
        color segments, in which case it comes back as the segment array. A client that only
        ever sends plain strings only ever reads plain strings - but a tracker fed by several
        producers can come back as an array to a client that did not send one.
    sparklinePeriod:
      type: string
    sparklineRef:
      type: string
      enum: [open, last]
    age:
      type: integer
      description: Seconds since last update.
    stale:
      type: boolean
      description: >
        True once the silence exceeds `staleAfter`. What the panel then does is
        set by `staleBehavior`.
    staleAfter:
      $ref: "common.yaml#/StaleAfter"
    staleBehavior:
      $ref: "common.yaml#/StaleBehavior"
    sparkline:
      type: array
      items:
        type: integer
      description: Sparkline data as scaled uint16 values (0-65535).
    volumes:
      type: array
      items:
        type: integer
      description: >
        Volume data as values scaled against the largest one of the series (0-255). Absent
        when the tracker was never sent any.

TrackerSummary:
  type: object
  properties:
    name:
      type: string
    symbol:
      type: string
    value:
      type: number
      format: float
    change:
      type: number
      format: float
    age:
      type: integer
    stale:
      type: boolean
    staleAfter:
      $ref: "common.yaml#/StaleAfter"
    staleBehavior:
      $ref: "common.yaml#/StaleBehavior"

TrackerListResponse:
  type: object
  properties:
    trackers:
      type: array
      items:
        $ref: "#/TrackerSummary"
    count:
      type: integer
      description: Total number of active trackers.
