                            description: RGB array [R, G, B]
                            examples:
                              - - 255
                                - 136
                                - 0
                          - type: string
                            pattern: ^#[0-9a-fA-F]{6}$
                            description: Hex string
                            examples:
                              - '#FF8800'
                          - type: integer
                            minimum: 0
                            maximum: 16777215
                            description: Unsigned 32-bit integer (0xRRGGBB)
                            examples:
                              - 16746496
                    description: Single string with explicit color override.
                  - type: array
                    items:
                      type: object
                      required:
                        - t
                        - c
                      properties:
                        t:
                          type: string
                          description: Text content for this segment.
                        c:
                          description: >
                            Color value. Accepts RGB array, hex string, or
                            unsigned 32-bit integer.
                          oneOf:
                            - type: array
                              items:
                                type: integer
                                minimum: 0
                                maximum: 255
                              minItems: 3
                              maxItems: 3
                              description: RGB array [R, G, B]
                              examples:
                                - - 255
                                  - 136
                                  - 0
                            - type: string
                              pattern: ^#[0-9a-fA-F]{6}$
                              description: Hex string
                              examples:
                                - '#FF8800'
                            - type: integer
                              minimum: 0
                              maximum: 16777215
                              description: Unsigned 32-bit integer (0xRRGGBB)
                              examples:
                                - 16746496
                      description: A text fragment with its own color.
                    minItems: 1
                    maxItems: 8
                    description: Array of colored segments (concatenated in display order).
            description: >
              Notification text, required. Accepts the three forms of a colored
              text field - plain string, single colored string, or up to eight
              colored segments concatenated in display order. Segments color the
              text and nothing else: the two separator lines keep the color they
              already had, and `color` still colors any text sent without a
              color of its own. A text that ends up empty is refused with HTTP
              400 `Missing text`, and that covers `""`, `{"text": ""}` and `[]`
              alike; over MQTT the message is dropped with a serial log. The 127
              characters are shared by every segment, and the two forms overflow
              differently: a plain string is cut at the last character that
              fits, while the first segment that no longer fits is dropped
              whole, text included, along with everything after it. Accents are
              shown as their closest ASCII letter, and since segment boundaries
              are counted in bytes but applied glyph by glyph, a boundary that
              comes after an accented character or a degree sign in the same
              string is applied one glyph late for each of them.
            examples:
              - Build passed
              - - t: 'Build '
                  c: '#FFFFFF'
                - t: failed
                  c: '#FF0000'
          id:
            type: string
            description: >
              Optional unique ID. If omitted, auto-generated as
              `notif_<millis>`.
          icon:
            type: string
            description: Icon name (without extension).
          color:
            allOf:
              - description: >
                  Color value. Accepts RGB array, hex string, or unsigned 32-bit
                  integer.
                oneOf:
                  - type: array
                    items:
                      type: integer
                      minimum: 0
                      maximum: 255
                    minItems: 3
                    maxItems: 3
                    description: RGB array [R, G, B]
                    examples:
                      - - 255
                        - 136
                        - 0
                  - type: string
                    pattern: ^#[0-9a-fA-F]{6}$
                    description: Hex string
                    examples:
                      - '#FF8800'
                  - type: integer
                    minimum: 0
                    maximum: 16777215
                    description: Unsigned 32-bit integer (0xRRGGBB)
                    examples:
                      - 16746496
            default: '#FFFFFF'
            description: >
              Two roles. It is the color the text takes wherever `text` carries
              none of its own, and it paints the two separator lines - unless
              `background` is set, which takes the lines over. A `text` written
              entirely in segments therefore still needs `color` set if the
              lines are meant to match it.
          background:
            description: >
              Color value. Accepts RGB array, hex string, or unsigned 32-bit
              integer.
            oneOf:
              - type: array
                items:
                  type: integer
                  minimum: 0
                  maximum: 255
                minItems: 3
                maxItems: 3
                description: RGB array [R, G, B]
                examples:
                  - - 255
                    - 136
                    - 0
              - type: string
                pattern: ^#[0-9a-fA-F]{6}$
                description: Hex string
                examples:
                  - '#FF8800'
              - type: integer
                minimum: 0
                maximum: 16777215
                description: Unsigned 32-bit integer (0xRRGGBB)
                examples:
                  - 16746496
          duration:
            type: integer
            description: Display duration in milliseconds.
            default: 5000
          hold:
            type: boolean
            description: |
              Hold notification until explicitly dismissed. Overrides duration.
            default: false
          urgent:
            type: boolean
            description: Jump to front of notification queue.
            default: false
          stack:
            type: boolean
            description: >
              Queue sequentially with other notifications (true) vs replace
              current notification (false).
            default: true
      examples:
        - name: alert
          summary: Urgent notification
          payload:
            text: Alert!
            icon: warning
            color: '#FF0000'
            urgent: true
        - name: segmentedAlert
          summary: Colored segments, with `color` still setting the separator lines
          payload:
            text:
              - t: 'Build '
                c: '#FFFFFF'
              - t: failed
                c: '#FF0000'
            icon: warning
            color: '#FF0000'
            urgent: true
    Indicator:
      payload:
        type: object
        properties:
          mode:
            type: string
            enum:
              - solid
              - blink
              - fade
              - 'off'
            description: >
              Indicator mode. If omitted but `color` is provided, defaults to
              `solid`. Use `off` to turn off the indicator.
          color:
            description: >
              Color value. Accepts RGB array, hex string, or unsigned 32-bit
              integer.
            oneOf:
              - type: array
                items:
                  type: integer
                  minimum: 0
                  maximum: 255
                minItems: 3
                maxItems: 3
                description: RGB array [R, G, B]
                examples:
                  - - 255
                    - 136
                    - 0
              - type: string
                pattern: ^#[0-9a-fA-F]{6}$
                description: Hex string
                examples:
                  - '#FF8800'
              - type: integer
                minimum: 0
                maximum: 16777215
                description: Unsigned 32-bit integer (0xRRGGBB)
                examples:
                  - 16746496
          blinkInterval:
            type: integer
            description: Blink interval in milliseconds (only for `blink` mode).
            default: 500
          fadePeriod:
            type: integer
            description: Fade cycle period in milliseconds (only for `fade` mode).
            default: 2000
      examples:
        - name: blinkGreen
          summary: Blinking green
          payload:
            mode: blink
            color: '#00FF00'
            blinkInterval: 500
        - name: 'off'
          summary: Turn off
          payload:
            mode: 'off'
    Brightness:
      payload:
        type: object
        required:
          - brightness
        properties:
          brightness:
            type: integer
            minimum: 0
            maximum: 255
      examples:
        - name: setBrightness
          payload:
            brightness: 50
    Settings:
      payload:
        type: object
        description: >
          Partial update: only provided fields are changed. Omitted fields keep
          their current values.
        properties:
          brightness:
            type: integer
            minimum: 0
            maximum: 255
            description: Display brightness (0-255).
          autoRotate:
            type: boolean
            description: Enable/disable automatic app rotation.
          defaultDuration:
            type: integer
            description: Default app display duration in milliseconds.
          weatherDuration:
            type: integer
            minimum: 3000
            maximum: 60000
            default: 12000
            description: >
              Display duration of the `weatherclock` app in milliseconds. It has
              its own duration because it runs an internal carousel — an hourly
              chart page plus the forecast day pages — and splits this time
              between them, so it needs more of it than a plain app. Applied to
              the running app immediately, no reboot needed, and persisted
              across reboots. Bounded to 3000-60000: below 3000 the carousel
              pages flip faster than they can be read, above 60000 the rotation
              parks on weather for a full minute.
          ntp:
            type: object
            description: >
              Update NTP source. Either field can be omitted; both are
              re-applied without reboot via `configTzTime()`.
            properties:
              server:
                type: string
                description: NTP server hostname.
              tz_posix:
                type: string
                maxLength: 63
                description: >
                  POSIX TZ string controlling local time display and DST
                  behaviour. Example: "CET-1CEST,M3.5.0,M10.5.0/3" for
                  Europe/Paris with EU DST. The device does not embed an IANA tz
                  database — clients should convert IANA names (e.g.
                  "Europe/Paris") to POSIX TZ before sending.
                examples:
                  - CET-1CEST,M3.5.0,M10.5.0/3
                  - UTC0
                  - EST5EDT,M3.2.0,M11.1.0
                default: CET-1CEST,M3.5.0,M10.5.0/3
      examples:
        - name: updateSettings
          payload:
            brightness: 100
            autoRotate: true
            defaultDuration: 15000
            weatherDuration: 12000
    Weather:
      payload:
        type: object
        required:
          - current
        properties:
          current:
            type: object
            required:
              - icon
              - temp
            properties:
              icon:
                type: string
                description: >
                  Weather icon name. Use one of the built-in icons below, or any
                  icon uploaded to the device filesystem.


                  **Built-in weather icons** (8x8, stored in PROGMEM):

                  | Name | Description | |------|-------------| | `w_clear_day`
                  | Sunny | | `w_clear_night` | Clear night | | `w_partly_day` |
                  Partly cloudy (day) | | `w_partly_night` | Partly cloudy
                  (night) | | `w_cloudy` | Cloudy | | `w_rain` | Rain | |
                  `w_heavy_rain` | Heavy rain | | `w_thunder` | Thunderstorm | |
                  `w_snow` | Snow | | `w_fog` | Fog |
                examples:
                  - w_clear_day
              temp:
                type: integer
                description: Current temperature.
              temp_min:
                type: integer
                description: Today's minimum temperature.
              temp_max:
                type: integer
                description: Today's maximum temperature.
              humidity:
                type: integer
                minimum: 0
                maximum: 100
                description: Humidity percentage.
          forecast:
            type: array
            items:
              type: object
              required:
                - day
                - icon
                - temp_min
                - temp_max
              properties:
                day:
                  type: string
                  maxLength: 3
                  description: Day abbreviation (3 chars, e.g. "LUN", "MON").
                  examples:
                    - LUN
                icon:
                  type: string
                  description: >
                    Weather icon name. Built-in PROGMEM icons: w_clear_day,
                    w_clear_night, w_partly_day, w_partly_night, w_cloudy,
                    w_rain, w_heavy_rain, w_thunder, w_snow, w_fog. Filesystem
                    icons also accepted.
                  examples:
                    - w_rain
                temp_min:
                  type: integer
                  description: Minimum temperature.
                temp_max:
                  type: integer
                  description: Maximum temperature.
            maxItems: 7
            description: >
              Forecast days, displayed in pages of 3 columns with automatic
              scrolling. Page timing is proportional to app duration.


              Start at tomorrow, not today: today's minimum and maximum are
              already on screen at all times as `current.temp_min` and
              `current.temp_max`, so a column for today would repeat them.


              The carousel is capped at 3 pages, which bounds how many days are
              actually shown. Sending `today` spends the first page on the
              hourly chart, leaving 6 days; without it, 9 days would fit but
              `maxItems` caps the array at 7. Days beyond what the carousel can
              show are stored and echoed back, but never displayed.
          today:
            type: object
            description: >
              Hourly window charted on the first carousel page of the
              WeatherClock app: a temperature curve over the precipitation bars.
              Hours are absolute local hours and are displayed as received, so
              the sender decides where the window starts. The numbers framing
              the curve are the temperatures of the first and last charted
              hours. The page appears on the first payload carrying a non-empty
              hours array. The segments array is stored and echoed back but is
              not currently drawn.
            properties:
              hours:
                type: array
                items:
                  type: object
                  required:
                    - h
                    - temp
                  properties:
                    h:
                      type: integer
                      minimum: 0
                      maximum: 23
                      description: Local hour of the day.
                      examples:
                        - 15
                    temp:
                      type: integer
                      minimum: -100
                      maximum: 100
                      description: >
                        Temperature for that hour, same unit as the current
                        conditions. Values outside the range are clamped to it.
                    pop:
                      type: integer
                      minimum: 0
                      maximum: 100
                      description: Precipitation probability, in percent.
                    precip:
                      type: integer
                      minimum: 0
                      maximum: 255
                      description: >-
                        Precipitation quantity in tenths of a millimetre (2
                        means 0.2 mm).
                maxItems: 12
                description: Hourly values (up to 12). Extra entries are ignored.
              segments:
                type: array
                items:
                  type: object
                  required:
                    - from
                    - to
                    - icon
                  properties:
                    from:
                      type: integer
                      minimum: 0
                      maximum: 23
                      description: First local hour of the segment (inclusive).
                    to:
                      type: integer
                      minimum: 0
                      maximum: 23
                      description: Last local hour of the segment (inclusive).
                    icon:
                      type: string
                      maxLength: 31
                      description: >
                        Weather icon name for the whole segment. Built-in
                        PROGMEM icons: w_clear_day, w_clear_night, w_partly_day,
                        w_partly_night, w_cloudy, w_rain, w_heavy_rain,
                        w_thunder, w_snow, w_fog. Longer names are truncated to
                        31 characters.
                      examples:
                        - w_partly_day
                maxItems: 4
                description: >
                  Sky segments covering the window (up to 4). Extra entries are
                  ignored. Segments are computed by the sender; they are stored
                  and echoed back but are not currently drawn.
          staleAfter:
            default: 3600
            type: integer
            minimum: 0
            maximum: 604800
            description: >
              Silence tolerated before the app is considered stale, in seconds.
              0 = never. The firmware cannot know when your data is due, so
              declare your own push interval plus a margin: a client pushing
              every 30 minutes sets 5400. Values above 604800 (7 days) are
              clamped.
            examples:
              - 5400
          staleBehavior:
            allOf:
              - type: string
                enum:
                  - hide
                  - dim
                  - badge
                  - none
                description: >
                  What the app does once stale. `hide` leaves the rotation until
                  the client pushes again, `dim` stays visible dimmed with a
                  STALE badge, `badge` stays visible at full colour with the
                  badge, `none` shows no sign at all. `dim` and `badge` are only
                  rendered by the tracker and gauge layouts; sending them to
                  another endpoint is rejected with HTTP 400.
                examples:
                  - badge
            enum:
              - hide
              - none
            default: hide
            description: >
              A forecast that stopped being refreshed turns wrong rather than
              merely old, so `hide` falls back to the clock. `none` keeps
              showing the last forecast. `dim` and `badge` belong to the tracker
              layout and are rejected here with HTTP 400.
      examples:
        - name: currentAndForecast
          payload:
            current:
              icon: w_clear_day
              temp: 22
              temp_min: 16
              temp_max: 29
              humidity: 50
            forecast:
              - day: MON
                icon: w_partly_day
                temp_min: 14
                temp_max: 23
              - day: TUE
                icon: w_rain
                temp_min: 10
                temp_max: 17
            today:
              hours:
                - h: 15
                  temp: 22
                  pop: 0
                  precip: 0
                - h: 16
                  temp: 23
                  pop: 10
                  precip: 2
                - h: 17
                  temp: 23
                  pop: 40
                  precip: 8
                - h: 18
                  temp: 21
                  pop: 80
                  precip: 25
              segments:
                - from: 15
                  to: 16
                  icon: w_partly_day
                - from: 17
                  to: 18
                  icon: w_rain
    Tracker:
      payload:
        type: object
        properties:
          name:
            type: string
            description: >
              Tracker identifier. Can also be passed as `?name=` query
              parameter.
          symbol:
            type: string
            maxLength: 31
            description: >
              Headline shown on the top row (e.g. "BTC", "Amundi PEA Monde").
              Longer than the row is wide is fine: the display scrolls it,
              pausing at each end. The row holds eight characters beside an icon
              and ten without one, since a tracker with no `icon` gives its
              headline the full width. The panel has no accented glyphs, so
              Latin-1 accents are shown as their closest ASCII letter - "Santé"
              reads "Sante". Anything else outside ASCII is dropped: "Cœur"
              reads "Cur", and a typographic apostrophe disappears.
            examples:
              - BTC
              - Amundi PEA Monde
          icon:
            type: string
            description: Icon name from filesystem.
            examples:
              - bitcoin
          currency:
            type: string
            maxLength: 7
            description: Currency label (e.g. "USD", "EUR").
            examples:
              - USD
          value:
            type: number
            format: float
            description: >
              Current price/value. The panel shows as many decimals as fit the
              value row, which the currency label shortens when one is set. Two
              decimals are always shown when they fit, so 128.4 reads 128.40 and
              6.232 keeps its third decimal. Digits beyond the seven a float can
              carry are dropped rather than printed as rounding noise.
            examples:
              - 98452.3
          change:
            type: number
            format: float
            description: Change percentage (positive or negative).
            examples:
              - 2.14
          sparkline:
            type: array
            items:
              type: number
              format: float
            maxItems: 63
            description: >
              Price series for the chart. The chart is 63 columns wide and plots
              one point per column, so 63 points are drawn as sent and a shorter
              series is stretched across the same columns, keeping its shape and
              both its endpoints. It is 20 rows tall, or 32 when the tracker
              sends no `bottomText`. Values are auto-scaled to fit the chart
              area (min/max normalization to uint16 0-65535); a series that
              never moves is drawn along the middle of the chart rather than
              along its floor. The curve is green above the reference line and
              red below it - see `sparklineRef`. Over MQTT the whole payload has
              to fit the 2 KB broker buffer, which a 63-point series plus 63
              volumes fills at about 1.5 KB; the REST endpoint accepts up to 16
              KB.
            examples:
              - - 92100
                - 89300
                - 93200
                - 91800
                - 95400
                - 94100
                - 97600
                - 96200
                - 98452
          volumes:
            type: array
            items:
              type: number
              format: float
            maxItems: 63
            description: >
              Optional volume series, drawn as midnight blue bars behind the
              curve. It keeps its own length and is stretched over the 63
              columns like `sparkline`, taking the nearest point rather than
              interpolating. It is scaled against its own largest value, not
              between its extremes, so a bar is read from zero. Bars are at
              least one pixel tall and at most three fifths of the chart. Omit
              the field to leave the chart without bars.
            examples:
              - - 3.2
                - 4.1
                - 3.8
                - 5.6
                - 4.9
                - 6.2
                - 5.1
                - 4.4
                - 6
          sparklineRef:
            type: string
            enum:
              - open
              - last
            default: open
            description: >
              Which price the chart compares every column against. `open` (the
              default) takes the first point of the series, so green means "up
              since the period opened". `last` takes the final point, so green
              means "the price was higher then than it is now" - which turns a
              rising week mostly red, the opposite of the usual reading. Both
              ends are marked: the reference is a dashed line every other pixel,
              the other end a darker dashed line, hidden when the two ends land
              within a pixel of each other.
          symbolColor:
            allOf:
              - description: >
                  Color value. Accepts RGB array, hex string, or unsigned 32-bit
                  integer.
                oneOf:
                  - type: array
                    items:
                      type: integer
                      minimum: 0
                      maximum: 255
                    minItems: 3
                    maxItems: 3
                    description: RGB array [R, G, B]
                    examples:
                      - - 255
                        - 136
                        - 0
                  - type: string
                    pattern: ^#[0-9a-fA-F]{6}$
                    description: Hex string
                    examples:
                      - '#FF8800'
                  - type: integer
                    minimum: 0
                    maximum: 16777215
                    description: Unsigned 32-bit integer (0xRRGGBB)
                    examples:
                      - 16746496
            default: '#00DC3C'
            description: >-
              Headline color on the top row. Defaults to the green of the
              tracker screen.
          sparklineColor:
            allOf:
              - description: >
                  Color value. Accepts RGB array, hex string, or unsigned 32-bit
                  integer.
                oneOf:
                  - type: array
                    items:
                      type: integer
                      minimum: 0
                      maximum: 255
                    minItems: 3
                    maxItems: 3
                    description: RGB array [R, G, B]
                    examples:
                      - - 255
                        - 136
                        - 0
                  - type: string
                    pattern: ^#[0-9a-fA-F]{6}$
                    description: Hex string
                    examples:
                      - '#FF8800'
                  - type: integer
                    minimum: 0
                    maximum: 16777215
                    description: Unsigned 32-bit integer (0xRRGGBB)
                    examples:
                      - 16746496
            deprecated: true
            description: >
              No longer drawn. The curve takes its two colors from its position
              against `sparklineRef`. Still accepted and echoed back so existing
              clients keep working.
          bottomText:
            allOf:
              - description: >
                  Polymorphic text field bounded to 31 characters and 8
                  segments. Each bound sits in the form it applies to, so a
                  plain string is only measured in characters and a segment
                  array only in segments. The character budget is shared by
                  every segment.
                oneOf:
                  - type: string
                    maxLength: 31
                    description: Plain text (uses default color).
                  - type: object
                    required:
                      - text
                      - color
                    properties:
                      text:
                        type: string
                        maxLength: 31
                      color:
                        description: >
                          Color value. Accepts RGB array, hex string, or
                          unsigned 32-bit integer.
                        oneOf:
                          - type: array
                            items:
                              type: integer
                              minimum: 0
                              maximum: 255
                            minItems: 3
                            maxItems: 3
                            description: RGB array [R, G, B]
                            examples:
                              - - 255
                                - 136
                                - 0
                          - type: string
                            pattern: ^#[0-9a-fA-F]{6}$
                            description: Hex string
                            examples:
                              - '#FF8800'
                          - type: integer
                            minimum: 0
                            maximum: 16777215
                            description: Unsigned 32-bit integer (0xRRGGBB)
                            examples:
                              - 16746496
                    description: Single string with explicit color override.
                  - type: array
                    items:
                      type: object
                      required:
                        - t
                        - c
                      properties:
                        t:
                          type: string
                          description: Text content for this segment.
                        c:
                          description: >
                            Color value. Accepts RGB array, hex string, or
                            unsigned 32-bit integer.
                          oneOf:
                            - type: array
                              items:
                                type: integer
                                minimum: 0
                                maximum: 255
                              minItems: 3
                              maxItems: 3
                              description: RGB array [R, G, B]
                              examples:
                                - - 255
                                  - 136
                                  - 0
                            - type: string
                              pattern: ^#[0-9a-fA-F]{6}$
                              description: Hex string
                              examples:
                                - '#FF8800'
                            - type: integer
                              minimum: 0
                              maximum: 16777215
                              description: Unsigned 32-bit integer (0xRRGGBB)
                              examples:
                                - 16746496
                      description: A text fragment with its own color.
                    minItems: 1
                    maxItems: 8
                    description: Array of colored segments (concatenated in display order).
            description: >
              Optional footer text on the bottom row, in the same font as the
              price: ten characters fit, and anything longer scrolls, pausing at
              each end. Leaving it out hands its rows, and those of the
              separator above it, to the chart, which grows from 20 rows to 32.
              Accepts the same three forms as a custom app's text: plain string,
              single colored string, or colored segments - the 31 characters are
              shared by every segment, a segment that no longer fits being
              dropped whole. Accents are transliterated as they are in `symbol`,
              and the degree sign is dropped. A tracker left on the default
              `staleBehavior` of `dim` dims these colors along with the rest of
              the screen.
            examples:
              - ATH 73.6K 03/24
              - - t: 'Vol '
                  c: '#888888'
                - t: 42B
                  c: '#00D4FF'
          sparklinePeriod:
            type: string
            maxLength: 4
            default: 24h
            description: >
              Period covered by the sparkline series, set into the rule above
              the chart, which stops short of it. Two characters read best -
              "7D", "1M", "3M", "1Y" - a longer label only shortens the rule.
              Send an empty string to hide it and run the rule the full width.
            examples:
              - 7D
          duration:
            type: integer
            description: Display duration in milliseconds.
            default: 10000
          staleAfter:
            default: 3600
            type: integer
            minimum: 0
            maximum: 604800
            description: >
              Silence tolerated before the app is considered stale, in seconds.
              0 = never. The firmware cannot know when your data is due, so
              declare your own push interval plus a margin: a client pushing
              every 30 minutes sets 5400. Values above 604800 (7 days) are
              clamped.
            examples:
              - 5400
          staleBehavior:
            default: dim
            type: string
            enum:
              - hide
              - dim
              - badge
              - none
            description: >
              What the app does once stale. `hide` leaves the rotation until the
              client pushes again, `dim` stays visible dimmed with a STALE
              badge, `badge` stays visible at full colour with the badge, `none`
              shows no sign at all. `dim` and `badge` are only rendered by the
              tracker and gauge layouts; sending them to another endpoint is
              rejected with HTTP 400.
            examples:
              - badge
      examples:
        - name: btcTracker
          summary: BTC price update
          payload:
            symbol: BTC
            icon: bitcoin
            currency: USD
            value: 98452.3
            change: 2.14
            sparkline:
              - 92100
              - 89300
              - 93200
              - 91800
              - 95400
            volumes:
              - 3.2
              - 4.1
              - 3.8
              - 5.6
              - 4.9
            sparklineRef: open
            symbolColor: '#FF8800'
            bottomText: ATH 73.6K 03/24
            sparklinePeriod: 7D
        - name: fundTracker
          summary: Fund with a scrolling name and a colored footer
          payload:
            symbol: Amundi PEA Monde
            icon: world
            currency: EUR
            value: 34.82
            change: 0.63
            symbolColor: '#4CAF50'
            bottomText:
              - t: 'MSCI '
                c: '#888888'
              - t: World
                c: '#00D4FF'
        - name: deleteTracker
          summary: Delete a tracker
          payload:
            delete: true
    Gauge:
      payload:
        type: object
        description: >
          Partial update: `title`, `icon` and `rows` are only written when
          present, so a client can push rows alone and leave the header
          untouched. A `rows` array replaces the stored rows whole - there is no
          per-row patch.
        properties:
          name:
            type: string
            maxLength: 15
            description: >
              Gauge identifier. Can also be passed as `?name=` query parameter.
              Up to two gauges exist at a time (`MAX_GAUGE_APPS`). A longer name
              is refused with HTTP 400 (`Gauge name too long (max 15)`) rather
              than shortened, since the shortened key and the `gauge_{name}` app
              id would stop matching; over MQTT the message is dropped with a
              serial log.
            examples:
              - claude
          title:
            allOf:
              - description: >
                  Polymorphic text field bounded to 31 characters and 4
                  segments. Each bound sits in the form it applies to, so a
                  plain string is only measured in characters and a segment
                  array only in segments. The character budget is shared by
                  every segment.
                oneOf:
                  - type: string
                    maxLength: 31
                    description: Plain text (uses default color).
                  - type: object
                    required:
                      - text
                      - color
                    properties:
                      text:
                        type: string
                        maxLength: 31
                      color:
                        description: >
                          Color value. Accepts RGB array, hex string, or
                          unsigned 32-bit integer.
                        oneOf:
                          - type: array
                            items:
                              type: integer
                              minimum: 0
                              maximum: 255
                            minItems: 3
                            maxItems: 3
                            description: RGB array [R, G, B]
                            examples:
                              - - 255
                                - 136
                                - 0
                          - type: string
                            pattern: ^#[0-9a-fA-F]{6}$
                            description: Hex string
                            examples:
                              - '#FF8800'
                          - type: integer
                            minimum: 0
                            maximum: 16777215
                            description: Unsigned 32-bit integer (0xRRGGBB)
                            examples:
                              - 16746496
                    description: Single string with explicit color override.
                  - type: array
                    items:
                      type: object
                      required:
                        - t
                        - c
                      properties:
                        t:
                          type: string
                          description: Text content for this segment.
                        c:
                          description: >
                            Color value. Accepts RGB array, hex string, or
                            unsigned 32-bit integer.
                          oneOf:
                            - type: array
                              items:
                                type: integer
                                minimum: 0
                                maximum: 255
                              minItems: 3
                              maxItems: 3
                              description: RGB array [R, G, B]
                              examples:
                                - - 255
                                  - 136
                                  - 0
                            - type: string
                              pattern: ^#[0-9a-fA-F]{6}$
                              description: Hex string
                              examples:
                                - '#FF8800'
                            - type: integer
                              minimum: 0
                              maximum: 16777215
                              description: Unsigned 32-bit integer (0xRRGGBB)
                              examples:
                                - 16746496
                      description: A text fragment with its own color.
                    minItems: 1
                    maxItems: 4
                    description: Array of colored segments (concatenated in display order).
            description: >
              Headline shown on the 12-pixel header (e.g. "Claude", "Disques").
              Longer than the header is wide is fine: the display scrolls it,
              pausing at each end. The header holds eight characters beside an
              icon and ten without one, since a gauge with no `icon` gives its
              title the full width. While a STALE badge is up the icon steps
              aside, the title restarts from the left margin and the band it
              gets is six characters wide. The panel has no accented glyphs, so
              Latin-1 accents are shown as their closest ASCII letter - "Santé"
              reads "Sante". Anything else outside ASCII is dropped. Accepts the
              three forms of a colored text field - plain string, single colored
              string, or colored segments, four of them here; a fifth segment
              keeps its text but not its color, running on in the fourth one's.
              The header band clips what is painted and never the string, so a
              color boundary stays on the character the client put it on,
              accents included, even mid-scroll. A gauge left on the default
              `staleBehavior` of `dim` dims these colors along with the rest of
              the screen.
            examples:
              - Claude
              - - t: 'Claude '
                  c: '#FFFFFF'
                - t: Max
                  c: '#D97757'
          icon:
            type: string
            description: >
              Icon name from filesystem, drawn 8x8 on the left of the header. It
              is hidden while the data is stale and `staleBehavior` is `dim` or
              `badge`: the STALE badge takes the header room the icon would
              need, so the badge replaces it until the client pushes again.
            examples:
              - claude
          rows:
            type: array
            items:
              type: object
              description: >
                One 14-pixel row: `label` / `info` / `value` on the top line,
                the progress bar and its `note` on the line below. The top line
                is laid out value first: `value` owns the right edge, `label`
                gets what is left once `value`, `info` and their two-pixel
                gutters are reserved and is the only field cut short, then
                `info` is centred in the gap those two actually leave open.
                Every field is drawn in TomThumb over the 61 pixels between the
                left margin and the right edge; most glyphs advance four pixels
                and the narrow ones (`1`, `:`, `.`, `i`, space) two or three, so
                a field too wide for its column is cut on the last glyph that
                fits rather than on a character count.
              properties:
                label:
                  allOf:
                    - description: >
                        Polymorphic text field bounded to 11 characters and 3
                        segments. Each bound sits in the form it applies to, so
                        a plain string is only measured in characters and a
                        segment array only in segments. The character budget is
                        shared by every segment.
                      oneOf:
                        - type: string
                          maxLength: 11
                          description: Plain text (uses default color).
                        - type: object
                          required:
                            - text
                            - color
                          properties:
                            text:
                              type: string
                              maxLength: 11
                            color:
                              description: >
                                Color value. Accepts RGB array, hex string, or
                                unsigned 32-bit integer.
                              oneOf:
                                - type: array
                                  items:
                                    type: integer
                                    minimum: 0
                                    maximum: 255
                                  minItems: 3
                                  maxItems: 3
                                  description: RGB array [R, G, B]
                                  examples:
                                    - - 255
                                      - 136
                                      - 0
                                - type: string
                                  pattern: ^#[0-9a-fA-F]{6}$
                                  description: Hex string
                                  examples:
                                    - '#FF8800'
                                - type: integer
                                  minimum: 0
                                  maximum: 16777215
                                  description: Unsigned 32-bit integer (0xRRGGBB)
                                  examples:
                                    - 16746496
                          description: Single string with explicit color override.
                        - type: array
                          items:
                            type: object
                            required:
                              - t
                              - c
                            properties:
                              t:
                                type: string
                                description: Text content for this segment.
                              c:
                                description: >
                                  Color value. Accepts RGB array, hex string, or
                                  unsigned 32-bit integer.
                                oneOf:
                                  - type: array
                                    items:
                                      type: integer
                                      minimum: 0
                                      maximum: 255
                                    minItems: 3
                                    maxItems: 3
                                    description: RGB array [R, G, B]
                                    examples:
                                      - - 255
                                        - 136
                                        - 0
                                  - type: string
                                    pattern: ^#[0-9a-fA-F]{6}$
                                    description: Hex string
                                    examples:
                                      - '#FF8800'
                                  - type: integer
                                    minimum: 0
                                    maximum: 16777215
                                    description: Unsigned 32-bit integer (0xRRGGBB)
                                    examples:
                                      - 16746496
                            description: A text fragment with its own color.
                          minItems: 1
                          maxItems: 3
                          description: >-
                            Array of colored segments (concatenated in display
                            order).
                  description: >
                    Row name, drawn on the left of the top line (e.g. "5h",
                    "credits"). It gets whatever width `info` and `value` did
                    not take, and is cut on the last glyph that fits - an `info`
                    long enough to reach the left margin leaves nothing of it.
                    Accepts the three forms of a colored text field - plain
                    string, single colored string, or colored segments, three of
                    them here - so one name can carry two readings in two greys
                    ("5h" then " reset"). The 11 characters are shared by every
                    segment and the first one that no longer fits in them is
                    dropped whole, text included, along with everything after
                    it; a fourth segment keeps its text but not its color,
                    running on in the third one's. The width cut comes after all
                    that, so a later segment can end up off screen while the row
                    still stores it. `info`, `value` and `note` stay plain
                    strings: they carry one reading each, and `color` and
                    `noteColor` already own the bar and the pace.
                  examples:
                    - 5h
                    - credits
                    - - t: 5h
                        c: '#FFFFFF'
                      - t: ' reset'
                        c: '#888888'
                info:
                  type: string
                  maxLength: 15
                  description: >
                    Optional context between the label and the value, usually a
                    reset time (e.g. "14:50", "15/08 17h"). Centred in the gap
                    between the end of the label and the start of the value, or
                    between the label and the right margin when the row carries
                    no `value`. It is cut on the last glyph that fits before
                    being centred, so it can never spill over either neighbour.
                    Formatting is the client's call: the firmware prints the
                    string as it is given.
                  examples:
                    - '14:50'
                    - 15/08 17h
                value:
                  type: string
                  maxLength: 7
                  description: >
                    Headline figure of the row, right-aligned on the last usable
                    pixel. A string rather than a number, so the unit travels
                    with it: "41%", "3.2GB", "12/20".
                  examples:
                    - 41%
                note:
                  type: string
                  maxLength: 7
                  description: >
                    Optional pace or trend marker, right-aligned on the bottom
                    line next to the bar. Its presence is what shortens the bar
                    from 60 to 38 pixels, so a row with no note gets a bar over
                    the full width. Only 21 pixels are left for it, five
                    TomThumb characters, and a longer note is cut on the last
                    one that fits. The panel carries no arrow glyph, so pace is
                    written with `^`, `>` and `v`.
                  examples:
                    - x1.2^
                percent:
                  type: integer
                  minimum: 0
                  maximum: 100
                  default: 0
                  description: >
                    Bar fill, clamped to 0-100 on parse. The only number the
                    firmware interprets; everything else on the row is text it
                    prints untouched. The fill is rounded to the nearest pixel
                    with a floor of one, so any percentage above zero lights at
                    least one pixel and only 0% leaves the bar empty. The fill
                    spans the 58 pixels inside a full-width bar, 36 inside a bar
                    shortened by a note.
                  examples:
                    - 41
                color:
                  default: '#FFFFFF'
                  description: >
                    Color value. Accepts RGB array, hex string, or unsigned
                    32-bit integer.
                  oneOf:
                    - type: array
                      items:
                        type: integer
                        minimum: 0
                        maximum: 255
                      minItems: 3
                      maxItems: 3
                      description: RGB array [R, G, B]
                      examples:
                        - - 255
                          - 136
                          - 0
                    - type: string
                      pattern: ^#[0-9a-fA-F]{6}$
                      description: Hex string
                      examples:
                        - '#FF8800'
                    - type: integer
                      minimum: 0
                      maximum: 16777215
                      description: Unsigned 32-bit integer (0xRRGGBB)
                      examples:
                        - 16746496
                noteColor:
                  default: '#969696'
                  description: >
                    Color value. Accepts RGB array, hex string, or unsigned
                    32-bit integer.
                  oneOf:
                    - type: array
                      items:
                        type: integer
                        minimum: 0
                        maximum: 255
                      minItems: 3
                      maxItems: 3
                      description: RGB array [R, G, B]
                      examples:
                        - - 255
                          - 136
                          - 0
                    - type: string
                      pattern: ^#[0-9a-fA-F]{6}$
                      description: Hex string
                      examples:
                        - '#FF8800'
                    - type: integer
                      minimum: 0
                      maximum: 16777215
                      description: Unsigned 32-bit integer (0xRRGGBB)
                      examples:
                        - 16746496
            maxItems: 9
            description: >
              Rows to display, three per page. Beyond three rows the panel
              paginates on its own, one dot per page at the bottom, each page
              holding the screen for the app duration divided by the page count
              - so the carousel never lengthens the rotation. A last page
              holding one or two rows is centred vertically in the band the
              three would have filled. More than nine rows is refused whole with
              HTTP 400 and the gauge keeps the rows it had.
          duration:
            type: integer
            description: >-
              Display duration in milliseconds, split evenly across the carousel
              pages.
            default: 10000
          staleAfter:
            default: 3600
            type: integer
            minimum: 0
            maximum: 604800
            description: >
              Silence tolerated before the app is considered stale, in seconds.
              0 = never. The firmware cannot know when your data is due, so
              declare your own push interval plus a margin: a client pushing
              every 30 minutes sets 5400. Values above 604800 (7 days) are
              clamped.
            examples:
              - 5400
          staleBehavior:
            default: dim
            type: string
            enum:
              - hide
              - dim
              - badge
              - none
            description: >
              What the app does once stale. `hide` leaves the rotation until the
              client pushes again, `dim` stays visible dimmed with a STALE
              badge, `badge` stays visible at full colour with the badge, `none`
              shows no sign at all. `dim` and `badge` are only rendered by the
              tracker and gauge layouts; sending them to another endpoint is
              rejected with HTTP 400.
            examples:
              - badge
      description: >
        Same payload as `POST /api/gauge`, except that a name over fifteen
        characters and an oversized `rows` array are dropped with a serial log
        instead of an HTTP 400, and an unknown `staleBehavior` falls back to
        `dim` instead of being rejected. Watch the payload size: the MQTT
        receive buffer is 2048 bytes (`MQTT_BUFFER_SIZE`) and nine rows come
        close to 1.3 KB, so a broker message longer than the buffer is dropped
        before the firmware ever parses it. Coloring a `title` or a `label`
        costs around 30 bytes a segment - `[{"t":"5h","c":"#FFFFFF"},{"t":"
        reset","c":"#888888"}]` against `"5h reset"` - which a nine-row gauge
        cannot afford: keep the labels plain over MQTT on a full gauge, or split
        the push into fewer rows per message. REST has no such ceiling.
      examples:
        - name: claudeLimits
          summary: Subscription limits, four rows over two pages
          payload:
            title: Claude
            icon: claude
            duration: 10000
            staleAfter: 2700
            staleBehavior: dim
            rows:
              - label: 5h
                info: '14:50'
                value: 41%
                percent: 41
                color: '#4CAF50'
                note: x1.2^
                noteColor: '#FFC107'
              - label: 7j
                info: 15/08 17h
                value: 28%
                percent: 28
                color: '#4CAF50'
                note: x1.1>
                noteColor: '#4CAF50'
              - label: fable
                value: 3%
                percent: 3
                color: '#4CAF50'
              - label: credits
                value: 1%
                percent: 1
                color: '#4CAF50'
        - name: diskUsage
          summary: Disk fill levels, no info and no note, bars at full width
          payload:
            title: Disques
            icon: disk
            rows:
              - label: root
                value: 62%
                percent: 62
                color: '#4CAF50'
              - label: data
                value: 88%
                percent: 88
                color: '#FFC107'
              - label: backup
                value: 97%
                percent: 97
                color: '#F44336'
        - name: coloredLabels
          summary: Two-color title and labels split between a window and its reset
          payload:
            title:
              - t: 'Claude '
                c: '#FFFFFF'
              - t: Max
                c: '#D97757'
            icon: claude
            rows:
              - label:
                  - t: 5h
                    c: '#FFFFFF'
                  - t: ' reset'
                    c: '#888888'
                value: 41%
                percent: 41
                color: '#4CAF50'
              - label:
                  - t: 7j
                    c: '#FFFFFF'
                  - t: ' reset'
                    c: '#888888'
                value: 28%
                percent: 28
                color: '#4CAF50'
        - name: deleteGauge
          summary: Delete a gauge
          payload:
            delete: true
    Status:
      payload:
        type: string
        enum:
          - online
          - offline
      examples:
        - name: online
          payload: online
        - name: offline
          payload: offline
    Stats:
      payload:
        type: object
        description: Compact stats payload published over MQTT every 60 seconds.
        properties:
          uptime:
            type: integer
          freeHeap:
            type: integer
          brightness:
            type: integer
          rssi:
            type: integer
          appCount:
            type: integer
          version:
            type: string
          currentApp:
            type: string
      examples:
        - name: stats
          payload:
            uptime: 3600
            freeHeap: 120000
            brightness: 128
            rssi: -45
            appCount: 3
            version: 0.1.0-dev
            currentApp: weather_clock
    SleepOverride:
      payload:
        type: object
        required:
          - until
        properties:
          until:
            type: integer
            minimum: 0
            description: >
              UTC Unix timestamp when the override expires (seconds since
              1970-01-01 UTC). Past values are rejected.
            examples:
              - 4102444800
      examples:
        - name: oneHourOverride
          summary: Sleep until a specific epoch
          payload:
            until: 4102444800
    Wake:
      payload:
        type: 'null'
      description: >
        Wake-now command. Payload is ignored. Clears the active sleep override;
        schedule-based sleep is not affected.
    Empty:
      payload:
        type: 'null'
      description: Empty payload (or any payload - ignored).
