  gauge:
    address: '{prefix}/gauge'
    description: >
      Create or update a gauge. Name must be in the JSON body. Send `{"delete":
      true, "name": "claude"}` to delete.
    parameters:
      prefix:
        default: pixelcast
    messages:
      gaugeMessage:
        payload:
          type: object
          description: >
            Partial update: `title`, `icon` and `rows` are only written when
            present, so a client can push rows alone and leave the header
            untouched. A `rows` array replaces the stored rows whole - there is
            no per-row patch.
          properties:
            name:
              type: string
              maxLength: 15
              description: >
                Gauge identifier. Can also be passed as `?name=` query
                parameter. Up to two gauges exist at a time (`MAX_GAUGE_APPS`).
                A longer name is refused with HTTP 400 (`Gauge name too long
                (max 15)`) rather than shortened, since the shortened key and
                the `gauge_{name}` app id would stop matching; over MQTT the
                message is dropped with a serial log.
              examples:
                - claude
            title:
              allOf:
                - description: >
                    Polymorphic text field bounded to 31 characters and 4
                    segments. Each bound sits in the form it applies to, so a
                    plain string is only measured in characters and a segment
                    array only in segments. The character budget is shared by
                    every segment.
                  oneOf:
                    - type: string
                      maxLength: 31
                      description: Plain text (uses default color).
                    - type: object
                      required:
                        - text
                        - color
                      properties:
                        text:
                          type: string
                          maxLength: 31
