        '404':
          description: Tracker not found.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/get/responses/400/content/application~1json/schema'
    post:
      operationId: createOrUpdateTracker
      summary: Create or update a tracker
      description: |
        Push tracker data (price, change%, sparkline, volumes). The tracker is automatically registered as an app in the rotation with ID `tracker_{name}`. Name can be in query param or JSON body.
      tags:
        - Tracker
      parameters:
        - name: name
          in: query
          schema:
            type: string
          description: Tracker name. Also accepted in JSON body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: |
                    Tracker identifier. Can also be passed as `?name=` query parameter.
                symbol:
                  type: string
                  maxLength: 31
                  description: |
                    Headline shown on the top row (e.g. "BTC", "Amundi PEA Monde"). Longer than the row is wide is fine: the display scrolls it, pausing at each end. The row holds eight characters beside an icon and ten without one, since a tracker with no `icon` gives its headline the full width. The panel has no accented glyphs, so Latin-1 accents are shown as their closest ASCII letter - "Santé" reads "Sante". Anything else outside ASCII is dropped: "Cœur" reads "Cur", and a typographic apostrophe disappears.
                  examples:
                    - BTC
                    - Amundi PEA Monde
                icon:
                  type: string
                  description: Icon name from filesystem.
                  examples:
                    - bitcoin
                currency:
                  type: string
                  maxLength: 7
                  description: 'Currency label (e.g. "USD", "EUR").'
                  examples:
                    - USD
                value:
                  type: number
                  format: float
                  description: |
                    Current price/value. The panel shows as many decimals as fit the value row, which the currency label shortens when one is set. Two decimals are always shown when they fit, so 128.4 reads 128.40 and 6.232 keeps its third decimal. Digits beyond the seven a float can carry are dropped rather than printed as rounding noise.
                  examples:
                    - 98452.3
                change:
                  type: number
                  format: float
                  description: Change percentage (positive or negative).
                  examples:
                    - 2.14
                sparkline:
                  type: array
                  items:
                    type: number
                    format: float
                  maxItems: 63
                  description: |
                    Price series for the chart. The chart is 63 columns wide and plots one point per column, so 63 points are drawn as sent and a shorter series is stretched across the same columns, keeping its shape and both its endpoints. It is 20 rows tall, or 32 when the tracker sends no `bottomText`. Values are auto-scaled to fit the chart area (min/max normalization to uint16 0-65535); a series that never moves is drawn along the middle of the chart rather than along its floor. The curve is green above the reference line and red below it - see `sparklineRef`. Over MQTT the whole payload has to fit the 2 KB broker buffer, which a 63-point series plus 63 volumes fills at about 1.5 KB; the REST endpoint accepts up to 16 KB.
                  examples:
                    - - 92100
                      - 89300
                      - 93200
                      - 91800
                      - 95400
                      - 94100
                      - 97600
                      - 96200
                      - 98452
                volumes:
                  type: array
                  items:
                    type: number
                    format: float
                  maxItems: 63
                  description: |
                    Optional volume series, drawn as midnight blue bars behind the curve. It keeps its own length and is stretched over the 63 columns like `sparkline`, taking the nearest point rather than interpolating. It is scaled against its own largest value, not between its extremes, so a bar is read from zero. Bars are at least one pixel tall and at most three fifths of the chart. Omit the field to leave the chart without bars.
                  examples:
                    - - 3.2
                      - 4.1
                      - 3.8
                      - 5.6
                      - 4.9
                      - 6.2
                      - 5.1
                      - 4.4
                      - 6
                sparklineRef:
                  type: string
                  enum:
                    - open
                    - last
                  default: open
                  description: |
                    Which price the chart compares every column against. `open` (the default) takes the first point of the series, so green means "up since the period opened". `last` takes the final point, so green means "the price was higher then than it is now" - which turns a rising week mostly red, the opposite of the usual reading. Both ends are marked: the reference is a dashed line every other pixel, the other end a darker dashed line, hidden when the two ends land within a pixel of each other.
                symbolColor:
                  allOf:
                    - $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/color'
                  default: '#00DC3C'
                  description: Headline color on the top row. Defaults to the green of the tracker screen.
                sparklineColor:
                  allOf:
                    - $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/color'
                  deprecated: true
                  description: |
                    No longer drawn. The curve takes its two colors from its position against `sparklineRef`. Still accepted and echoed back so existing clients keep working.
                bottomText:
                  allOf:
                    - $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/text'
                  maxLength: 31
                  description: |
                    Optional footer text on the bottom row, in the same font as the price: ten characters fit, and anything longer scrolls, pausing at each end. Leaving it out hands its rows, and those of the separator above it, to the chart, which grows from 20 rows to 32. Accepts the same three forms as a custom app's text: plain string, single colored string, or colored segments - `maxLength` bounds the plain form, and the other two are cut at the same 31 characters, a segment that no longer fits being dropped whole. Accents are transliterated as they are in `symbol`, and the degree sign is dropped. A tracker left on the default `staleBehavior` of `dim` dims these colors along with the rest of the screen.
                  examples:
                    - ATH 73.6K 03/24
                    - - t: 'Vol '
                        c: '#888888'
                      - t: 42B
                        c: '#00D4FF'
                sparklinePeriod:
                  type: string
                  maxLength: 4
                  default: 24h
                  description: |
                    Period covered by the sparkline series, set into the rule above the chart, which stops short of it. Two characters read best - "7D", "1M", "3M", "1Y" - a longer label only shortens the rule. Send an empty string to hide it and run the rule the full width.
                  examples:
                    - 7D
                duration:
                  type: integer
                  description: Display duration in milliseconds.
                  default: 10000
                staleAfter:
                  $ref: '#/paths/~1gauge/get/responses/200/content/application~1json/schema/properties/staleAfter'
                  default: 3600
                staleBehavior:
                  $ref: '#/paths/~1gauge/get/responses/200/content/application~1json/schema/properties/staleBehavior'
                  default: dim
            examples:
              btcTracker:
                summary: BTC tracker with sparkline and volumes
                value:
                  symbol: BTC
                  icon: bitcoin
                  currency: USD
                  value: 98452.3
                  change: 2.14
                  sparkline:
                    - 92100
                    - 89300
                    - 93200
                    - 91800
                    - 95400
                    - 94100
                    - 97600
                    - 96200
                    - 98452
                  volumes:
                    - 3.2
                    - 4.1
                    - 3.8
                    - 5.6
                    - 4.9
                    - 6.2
                    - 5.1
                    - 4.4
                    - 6
                  sparklineRef: open
                  symbolColor: '#FF8800'
                  bottomText: ATH 73.6K 03/24
                  sparklinePeriod: 7D
              fundTracker:
                summary: Fund with a scrolling name and a colored footer
                value:
                  symbol: Amundi PEA Monde
                  icon: world
                  currency: EUR
                  value: 34.82
                  change: 0.63
                  sparkline:
                    - 34100
                    - 34300
                    - 34200
                    - 34500
                    - 34700
                    - 34600
                    - 34820
                  symbolColor: '#4CAF50'
                  sparklinePeriod: 1M
                  bottomText:
                    - t: 'MSCI '
                      c: '#888888'
                    - t: World
                      c: '#00D4FF'
      responses:
        '200':
          description: Tracker created or updated.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/post/responses/200/content/application~1json/schema'
        '400':
          description: Missing tracker name.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/get/responses/400/content/application~1json/schema'
        '500':
          description: No tracker slot available.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/get/responses/400/content/application~1json/schema'
    delete:
      operationId: deleteTracker
      summary: Delete a tracker
      description: Removes the tracker data and its app from rotation.
      tags:
        - Tracker
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Tracker name to delete.
      responses:
        '200':
          description: Tracker deleted.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/post/responses/200/content/application~1json/schema'
        '400':
          description: Missing tracker name.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/get/responses/400/content/application~1json/schema'
        '404':
          description: Tracker not found.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/get/responses/400/content/application~1json/schema'
  /gauges:
    get:
      operationId: listGauges
      summary: List all active gauges
      tags:
        - Gauge
      responses:
        '200':
          description: List of gauge summaries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  gauges:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        title:
                          type: string
                          description: |
                            Always the plain text, colors dropped, as a colored title also reads in `GET /api/apps`. Ask `GET /api/gauge` for the form the gauge stores.
                        rowCount:
                          type: integer
                          description: Number of rows currently stored.
                        age:
                          type: integer
                        stale:
                          type: boolean
                        staleAfter:
                          $ref: '#/paths/~1gauge/get/responses/200/content/application~1json/schema/properties/staleAfter'
                        staleBehavior:
                          $ref: '#/paths/~1gauge/get/responses/200/content/application~1json/schema/properties/staleBehavior'
                  count:
                    type: integer
                    description: Total number of active gauges.
  /gauge:
    get:
      operationId: getGauge
      summary: Get single gauge data
      tags:
        - Gauge
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Gauge identifier (e.g. "claude").
      responses:
        '200':
          description: Gauge data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  title:
                    allOf:
                      - $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/text'
                    description: |
                      Echoed in the form it was stored: a plain string unless the title was written with color segments, in which case it comes back as the segment array.
                  icon:
                    type: string
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        label:
                          allOf:
                            - $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/text'
                          description: |
                            Echoed in the form it was stored, like the title: a plain string, or the segment array the client sent, trimmed to the segments that fitted.
                        info:
                          type: string
                        value:
                          type: string
                        note:
                          type: string
                        percent:
                          type: integer
                        color:
                          type: string
                          pattern: '^#[0-9a-fA-F]{6}$'
                          description: Hex color string.
                          examples:
                            - '#4CAF50'
                        noteColor:
                          type: string
                          pattern: '^#[0-9a-fA-F]{6}$'
                          description: Hex color string.
                          examples:
                            - '#FFC107'
                    description: |
                      Rows as stored, in display order. Text fields come back trimmed to what the firmware kept, and colors as hex strings whatever form they were sent in.
                  age:
                    type: integer
                    description: Seconds since last update.
                  stale:
                    type: boolean
                    description: |
                      True once the silence exceeds `staleAfter`. What the panel then does is set by `staleBehavior`.
                  staleAfter:
                    type: integer
                    minimum: 0
                    maximum: 604800
                    description: |
                      Silence tolerated before the app is considered stale, in seconds. 0 = never. The firmware cannot know when your data is due, so declare your own push interval plus a margin: a client pushing every 30 minutes sets 5400. Values above 604800 (7 days) are clamped.
                    examples:
                      - 5400
                  staleBehavior:
                    type: string
                    enum:
                      - hide
                      - dim
                      - badge
                      - none
                    description: |
                      What the app does once stale. `hide` leaves the rotation until the client pushes again, `dim` stays visible dimmed with a STALE badge, `badge` stays visible at full colour with the badge, `none` shows no sign at all. `dim` and `badge` are only rendered by the tracker and gauge layouts; sending them to another endpoint is rejected with HTTP 400.
                    examples:
                      - badge
        '400':
          description: Missing gauge name.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    description: Human-readable error message.
                examples:
                  - error: Invalid JSON
        '404':
          description: Gauge not found.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/get/responses/400/content/application~1json/schema'
    post:
      operationId: createOrUpdateGauge
      summary: Create or update a gauge
      description: |
        Push a set of rows, each a bounded 0-100% value with its own progress bar. The gauge is automatically registered as an app in the rotation with ID `gauge_{name}`. Name can be in query param or JSON body. The update is partial: `title`, `icon` and `rows` are only written when present, and a `rows` array replaces the stored rows whole. Two gauges can exist at a time.
      tags:
        - Gauge
      parameters:
        - name: name
          in: query
          schema:
            type: string
          description: Gauge name. Also accepted in JSON body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Partial update: `title`, `icon` and `rows` are only written when present, so a client can push rows alone and leave the header untouched. A `rows` array replaces the stored rows whole - there is no per-row patch.
              properties:
                name:
                  type: string
                  maxLength: 15
                  description: |
                    Gauge identifier. Can also be passed as `?name=` query parameter. Up to two gauges exist at a time (`MAX_GAUGE_APPS`). A longer name is refused with HTTP 400 (`Gauge name too long (max 15)`) rather than shortened, since the shortened key and the `gauge_{name}` app id would stop matching; over MQTT the message is dropped with a serial log.
                  examples:
                    - claude
                title:
                  allOf:
                    - $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/text'
                  maxLength: 31
                  maxItems: 4
                  description: |
                    Headline shown on the 12-pixel header (e.g. "Claude", "Disques"). Longer than the header is wide is fine: the display scrolls it, pausing at each end. The header holds eight characters beside an icon and ten without one, since a gauge with no `icon` gives its title the full width. While a STALE badge is up the icon steps aside, the title restarts from the left margin and the band it gets is six characters wide. The panel has no accented glyphs, so Latin-1 accents are shown as their closest ASCII letter - "Santé" reads "Sante". Anything else outside ASCII is dropped. Accepts the three forms of a colored text field - plain string, single colored string, or colored segments, four of them here; a fifth segment keeps its text but not its color, running on in the fourth one's. The header band clips what is painted and never the string, so a color boundary stays on the character the client put it on, accents included, even mid-scroll. A gauge left on the default `staleBehavior` of `dim` dims these colors along with the rest of the screen.
                  examples:
                    - Claude
                    - - t: 'Claude '
                        c: '#FFFFFF'
                      - t: Max
                        c: '#D97757'
                icon:
                  type: string
                  description: |
                    Icon name from filesystem, drawn 8x8 on the left of the header. It is hidden while the data is stale and `staleBehavior` is `dim` or `badge`: the STALE badge takes the header room the icon would need, so the badge replaces it until the client pushes again.
                  examples:
                    - claude
                rows:
                  type: array
                  items:
                    type: object
                    description: |
                      One 14-pixel row: `label` / `info` / `value` on the top line, the progress bar and its `note` on the line below. The top line is laid out value first: `value` owns the right edge, `label` gets what is left once `value`, `info` and their two-pixel gutters are reserved and is the only field cut short, then `info` is centred in the gap those two actually leave open. Every field is drawn in TomThumb over the 61 pixels between the left margin and the right edge; most glyphs advance four pixels and the narrow ones (`1`, `:`, `.`, `i`, space) two or three, so a field too wide for its column is cut on the last glyph that fits rather than on a character count.
                    properties:
                      label:
                        allOf:
                          - $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/text'
                        maxLength: 11
                        maxItems: 3
                        description: |
                          Row name, drawn on the left of the top line (e.g. "5h", "credits"). It gets whatever width `info` and `value` did not take, and is cut on the last glyph that fits - an `info` long enough to reach the left margin leaves nothing of it. Accepts the three forms of a colored text field - plain string, single colored string, or colored segments, three of them here - so one name can carry two readings in two greys ("5h" then " reset"). The 11 characters are shared by every segment and the first one that no longer fits in them is dropped whole, text included, along with everything after it; a fourth segment keeps its text but not its color, running on in the third one's. The width cut comes after all that, so a later segment can end up off screen while the row still stores it. `info`, `value` and `note` stay plain strings: they carry one reading each, and `color` and `noteColor` already own the bar and the pace.
                        examples:
                          - 5h
                          - credits
                          - - t: 5h
                              c: '#FFFFFF'
                            - t: ' reset'
                              c: '#888888'
                      info:
                        type: string
                        maxLength: 15
                        description: |
                          Optional context between the label and the value, usually a reset time (e.g. "14:50", "15/08 17h"). Centred in the gap between the end of the label and the start of the value, or between the label and the right margin when the row carries no `value`. It is cut on the last glyph that fits before being centred, so it can never spill over either neighbour. Formatting is the client's call: the firmware prints the string as it is given.
                        examples:
                          - '14:50'
                          - 15/08 17h
                      value:
                        type: string
                        maxLength: 7
                        description: |
                          Headline figure of the row, right-aligned on the last usable pixel. A string rather than a number, so the unit travels with it: "41%", "3.2GB", "12/20".
                        examples:
                          - 41%
                      note:
                        type: string
                        maxLength: 7
                        description: |
                          Optional pace or trend marker, right-aligned on the bottom line next to the bar. Its presence is what shortens the bar from 60 to 38 pixels, so a row with no note gets a bar over the full width. Only 21 pixels are left for it, five TomThumb characters, and a longer note is cut on the last one that fits. The panel carries no arrow glyph, so pace is written with `^`, `>` and `v`.
                        examples:
                          - x1.2^
                      percent:
                        type: integer
                        minimum: 0
                        maximum: 100
                        default: 0
                        description: |
                          Bar fill, clamped to 0-100 on parse. The only number the firmware interprets; everything else on the row is text it prints untouched. The fill is rounded to the nearest pixel with a floor of one, so any percentage above zero lights at least one pixel and only 0% leaves the bar empty. The fill spans the 58 pixels inside a full-width bar, 36 inside a bar shortened by a note.
                        examples:
                          - 41
                      color:
                        $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/color'
                        default: '#FFFFFF'
                      noteColor:
                        $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/color'
                        default: '#969696'
                  maxItems: 9
                  description: |
                    Rows to display, three per page. Beyond three rows the panel paginates on its own, one dot per page at the bottom, each page holding the screen for the app duration divided by the page count - so the carousel never lengthens the rotation. A last page holding one or two rows is centred vertically in the band the three would have filled. More than nine rows is refused whole with HTTP 400 and the gauge keeps the rows it had.
                duration:
                  type: integer
                  description: 'Display duration in milliseconds, split evenly across the carousel pages.'
                  default: 10000
                staleAfter:
                  $ref: '#/paths/~1gauge/get/responses/200/content/application~1json/schema/properties/staleAfter'
                  default: 3600
                staleBehavior:
                  $ref: '#/paths/~1gauge/get/responses/200/content/application~1json/schema/properties/staleBehavior'
                  default: dim
            examples:
              claudeLimits:
                summary: 'Subscription limits, four rows over two pages'
                value:
                  title: Claude
                  icon: claude
                  duration: 10000
                  staleAfter: 2700
                  staleBehavior: dim
                  rows:
                    - label: 5h
                      info: '14:50'
                      value: 41%
                      percent: 41
                      color: '#4CAF50'
                      note: x1.2^
                      noteColor: '#FFC107'
                    - label: 7j
                      info: 15/08 17h
                      value: 28%
                      percent: 28
                      color: '#4CAF50'
                      note: x1.1>
                      noteColor: '#4CAF50'
                    - label: fable
                      value: 3%
                      percent: 3
                      color: '#4CAF50'
                    - label: credits
                      value: 1%
                      percent: 1
                      color: '#4CAF50'
              diskUsage:
                summary: 'Disk fill levels, no info and no note, bars at full width'
                value:
                  title: Disques
                  icon: disk
                  rows:
                    - label: root
                      value: 62%
                      percent: 62
                      color: '#4CAF50'
                    - label: data
                      value: 88%
                      percent: 88
                      color: '#FFC107'
                    - label: backup
                      value: 97%
                      percent: 97
                      color: '#F44336'
      responses:
        '200':
          description: Gauge created or updated.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                properties:
                  success:
                    type: boolean
                    const: true
                examples:
                  - success: true
        '400':
          description: |
            Missing gauge name, invalid JSON, a name over fifteen characters (`Gauge name too long (max 15)`), more than nine rows (`Too many rows (max 9)`), or an unknown `staleBehavior`. Nothing is written unless the whole payload is accepted.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/get/responses/400/content/application~1json/schema'
        '500':
          description: No gauge slot available.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1gauge/get/responses/400/content/application~1json/schema'
    delete:
      operationId: deleteGauge
      summary: Delete a gauge
      description: Removes the gauge data and its app from rotation.
      tags:
        - Gauge
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Gauge name to delete.
      responses:
        '200':
          description: Gauge deleted.
          content:
