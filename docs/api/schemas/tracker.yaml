# Tracker schemas

TrackerUpdateRequest:
  type: object
  properties:
    name:
      type: string
      description: >
        Tracker identifier. Can also be passed as `?name=` query parameter.
    symbol:
      type: string
      maxLength: 31
      description: >
        Headline shown on the top row (e.g. "BTC", "Amundi PEA Monde"). Longer than the
        row is wide is fine: the display scrolls it, pausing at each end. The row holds
        eight characters beside an icon and ten without one, since a tracker with no
        `icon` gives its headline the full width. The panel has
        no accented glyphs, so Latin-1 accents are shown as their closest ASCII letter -
        "Santé" reads "Sante". Anything else outside ASCII is dropped: "Cœur" reads
        "Cur", and a typographic apostrophe disappears.
      examples:
        - "BTC"
        - "Amundi PEA Monde"
    icon:
      type: string
      description: Icon name from filesystem.
      examples:
        - "bitcoin"
    currency:
      type: string
      maxLength: 7
      description: Currency label (e.g. "USD", "EUR").
      examples:
        - "USD"
    value:
      type: number
      format: float
      description: >
        Current price/value. The panel shows as many decimals as fit the value row,
        which the currency label shortens when one is set. Two decimals are always
        shown when they fit, so 128.4 reads 128.40 and 6.232 keeps its third decimal.
        Digits beyond the seven a float can carry are dropped rather than printed as
        rounding noise.
      examples:
        - 98452.30
    change:
      type: number
      format: float
      description: Change percentage (positive or negative).
      examples:
        - 2.14
    sparkline:
      type: array
      items:
        type: number
        format: float
      maxItems: 24
      description: >
        Up to 24 data points for the sparkline chart. Values are auto-scaled
        to fit the chart area (min/max normalization to uint16 0-65535).
      examples:
        - [92100, 89300, 93200, 91800, 95400, 94100, 97600, 96200, 98452]
    symbolColor:
      $ref: "common.yaml#/Color"
    sparklineColor:
      $ref: "common.yaml#/Color"
    bottomText:
      allOf:
        - $ref: "common.yaml#/PolymorphicTextField"
      maxLength: 31
      description: >
        Optional footer text on the bottom row. Scrolls when it is wider than the panel.
        Accepts the same three forms as a custom app's text: plain string, single colored
        string, or colored segments - `maxLength` bounds the plain form, and the other two
        are cut at the same 31 characters, a segment that no longer fits being dropped
        whole. Accents are transliterated as they are in `symbol`, and the degree sign is
        dropped, the footer font carrying no glyph for it. A tracker left on the default
        `staleBehavior` of `dim` dims these colors along with the rest of the screen.
      examples:
        - "Vol 24h: 42B"
        - [{"t": "Vol ", "c": "#888888"}, {"t": "42B", "c": "#00D4FF"}]
    sparklinePeriod:
      type: string
      maxLength: 4
      default: "24h"
      description: >
        Period covered by the sparkline series, displayed as a short label above
        the chart (e.g. "24h", "7d", "30d"). Send an empty string to hide it.
      examples:
        - "7d"
    duration:
      type: integer
      description: Display duration in milliseconds.
      default: 10000
    staleAfter:
      $ref: "common.yaml#/StaleAfter"
      default: 3600
    staleBehavior:
      $ref: "common.yaml#/StaleBehavior"
      default: dim

TrackerResponse:
  type: object
  properties:
    name:
      type: string
    symbol:
      type: string
    icon:
      type: string
    currency:
      type: string
    value:
      type: number
      format: float
    change:
      type: number
      format: float
    symbolColor:
      type: string
      pattern: "^#[0-9a-fA-F]{6}$"
      description: Hex color string.
      examples:
        - "#FF8800"
    sparklineColor:
      type: string
      pattern: "^#[0-9a-fA-F]{6}$"
      description: Hex color string.
      examples:
        - "#00D4FF"
    bottomText:
      allOf:
        - $ref: "common.yaml#/PolymorphicTextField"
      description: >
        Echoed in the form it was stored: a plain string unless the value was written with
        color segments, in which case it comes back as the segment array. A client that only
        ever sends plain strings only ever reads plain strings - but a tracker fed by several
        producers can come back as an array to a client that did not send one.
    sparklinePeriod:
      type: string
    age:
      type: integer
      description: Seconds since last update.
    stale:
      type: boolean
      description: >
        True once the silence exceeds `staleAfter`. What the panel then does is
        set by `staleBehavior`.
    staleAfter:
      $ref: "common.yaml#/StaleAfter"
    staleBehavior:
      $ref: "common.yaml#/StaleBehavior"
    sparkline:
      type: array
      items:
        type: integer
      description: Sparkline data as scaled uint16 values (0-65535).

TrackerSummary:
  type: object
  properties:
    name:
      type: string
    symbol:
      type: string
    value:
      type: number
      format: float
    change:
      type: number
      format: float
    age:
      type: integer
    stale:
      type: boolean
    staleAfter:
      $ref: "common.yaml#/StaleAfter"
    staleBehavior:
      $ref: "common.yaml#/StaleBehavior"

TrackerListResponse:
  type: object
  properties:
    trackers:
      type: array
      items:
        $ref: "#/TrackerSummary"
    count:
      type: integer
      description: Total number of active trackers.
