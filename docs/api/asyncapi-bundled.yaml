                  value: 41%
                  percent: 41
                  color: '#4CAF50'
                  note: x1.2^
                  noteColor: '#FFC107'
                - label: 7j
                  info: 15/08 17h
                  value: 28%
                  percent: 28
                  color: '#4CAF50'
                  note: x1.1>
                  noteColor: '#4CAF50'
                - label: fable
                  value: 3%
                  percent: 3
                  color: '#4CAF50'
                - label: credits
                  value: 1%
                  percent: 1
                  color: '#4CAF50'
          - name: diskUsage
            summary: Disk fill levels, no info and no note, bars at full width
