                  stale:
                    type: boolean
                    description: |
                      True once the silence exceeds `staleAfter`. What the panel then does is set by `staleBehavior`.
                  staleAfter:
                    $ref: '#/paths/~1gauge/get/responses/200/content/application~1json/schema/properties/staleAfter'
                  staleBehavior:
                    $ref: '#/paths/~1gauge/get/responses/200/content/application~1json/schema/properties/staleBehavior'
                  sparkline:
                    type: array
                    items:
                      type: integer
                    description: Sparkline data as scaled uint16 values (0-65535).
                  volumes:
                    type: array
                    items:
                      type: integer
                    description: |
                      Volume data as values scaled against the largest one of the series (0-255). Absent when the tracker was never sent any.
        '400':
          description: Missing tracker name.
