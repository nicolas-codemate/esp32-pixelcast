  notify:
    address: '{prefix}/notify'
    description: Send a notification to the display.
    parameters:
      prefix:
        default: pixelcast
    messages:
      notificationMessage:
        payload:
          type: object
          required:
            - text
          properties:
            text:
              type: string
              description: Notification text (required, max 128 chars).
              maxLength: 128
            id:
              type: string
              description: >
                Optional unique ID. If omitted, auto-generated as
                `notif_<millis>`.
            icon:
              type: string
              description: Icon name (without extension).
            color:
              description: >
                Color value. Accepts RGB array, hex string, or unsigned 32-bit
                integer.
              oneOf:
                - type: array
                  items:
                    type: integer
                    minimum: 0
                    maximum: 255
                  minItems: 3
                  maxItems: 3
                  description: RGB array [R, G, B]
                  examples:
                    - - 255
                      - 136
                      - 0
                - type: string
                  pattern: ^#[0-9a-fA-F]{6}$
                  description: Hex string
                  examples:
                    - '#FF8800'
                - type: integer
                  minimum: 0
                  maximum: 16777215
                  description: Unsigned 32-bit integer (0xRRGGBB)
                  examples:
                    - 16746496
            background:
              description: >
                Color value. Accepts RGB array, hex string, or unsigned 32-bit
                integer.
              oneOf:
                - type: array
                  items:
                    type: integer
                    minimum: 0
                    maximum: 255
                  minItems: 3
                  maxItems: 3
                  description: RGB array [R, G, B]
                  examples:
                    - - 255
                      - 136
                      - 0
                - type: string
                  pattern: ^#[0-9a-fA-F]{6}$
                  description: Hex string
                  examples:
                    - '#FF8800'
                - type: integer
                  minimum: 0
                  maximum: 16777215
                  description: Unsigned 32-bit integer (0xRRGGBB)
                  examples:
                    - 16746496
            duration:
              type: integer
              description: Display duration in milliseconds.
              default: 5000
            hold:
              type: boolean
              description: >
                Hold notification until explicitly dismissed. Overrides
                duration.
              default: false
            urgent:
              type: boolean
              description: Jump to front of notification queue.
              default: false
            stack:
              type: boolean
              description: >
                Queue sequentially with other notifications (true) vs replace
                current notification (false).
              default: true
        examples:
          - name: alert
            summary: Urgent notification
            payload:
              text: Alert!
              icon: warning
              color: '#FF0000'
              urgent: true
