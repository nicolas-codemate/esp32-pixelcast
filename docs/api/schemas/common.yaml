StaleAfter:
  type: integer
  minimum: 0
  maximum: 604800
  description: >
    Silence tolerated before the app is considered stale, in seconds. 0 = never.
    The firmware cannot know when your data is due, so declare your own push
    interval plus a margin: a client pushing every 30 minutes sets 5400. Values
    above 604800 (7 days) are clamped.
  examples:
    - 5400

StaleBehavior:
  type: string
  enum: [hide, dim, badge, none]
  description: >
    What the app does once stale. `hide` leaves the rotation until the client
    pushes again, `dim` stays visible dimmed with a STALE badge, `badge` stays
    visible at full colour with the badge, `none` shows no sign at all.
    `dim` and `badge` are only rendered by the tracker and gauge layouts; sending
    them to another endpoint is rejected with HTTP 400.
  examples:
    - "badge"

SuccessResponse:
  type: object
  required: [success]
  properties:
    success:
      type: boolean
      const: true
  examples:
    - success: true

ErrorResponse:
  type: object
  required: [error]
  properties:
    error:
      type: string
      description: Human-readable error message.
  examples:
    - error: "Invalid JSON"
