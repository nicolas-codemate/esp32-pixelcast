asyncapi: 3.0.0
info:
  title: ESP32-PixelCast MQTT API
  version: 0.2.0
  description: >
    MQTT interface for controlling a HUB75 LED matrix panel (64x64) running on
    ESP32 Trinity. JSON payloads mirror the REST API. MQTT must be enabled via
    `POST /api/settings` or the settings file.


    **Key differences from REST:**

    - Fire-and-forget: no response (errors logged to Serial only).

    - Delete via `{"delete": true}` flag instead of HTTP DELETE.

    - Name can be in topic path or JSON body for custom/tracker.

    - No icon management over MQTT.

    **BREAKING (v0.2.0)**: sleep `until` epoch semantics changed from the
    device's local frame to UTC Unix timestamps. Clients that previously added
    the device's NTP offset before sending must stop doing so.
  license:
    name: MIT
defaultContentType: application/json
servers:
  mosquitto:
    host: '{brokerHost}:{brokerPort}'
    protocol: mqtt
    description: MQTT broker (e.g. Mosquitto).
    variables:
      brokerHost:
        default: localhost
      brokerPort:
        default: '1883'
    bindings:
      mqtt:
        clientId: pixelcast_{MAC}
        keepAlive: 60
        cleanSession: true
        lastWill:
          topic: '{prefix}/status'
          qos: 0
          retain: true
          message: offline
channels:
  custom:
    address: '{prefix}/custom'
    description: >
      Create or update a custom app. App name must be in the JSON body. Send
      `{"delete": true, "name": "appName"}` to delete.
    parameters:
      prefix:
        description: MQTT topic prefix (default "pixelcast").
        default: pixelcast
    messages:
      customAppMessage:
        payload:
          type: object
          description: >
            Create or update a custom app in the rotation. Supports single-zone
            (text/icon/color) or multi-zone (zones array) layouts.
          properties:
            name:
              type: string
              description: >
                App name (identifier). Can also be passed as `?name=` query
                parameter.
            text:
              description: >
                Text field accepting three formats: plain string, colored string
                object, or array of colored segments (max 8).
              oneOf:
                - type: string
                  description: Plain text (uses default color).
                  examples:
                    - 22.5C
                - type: object
                  required:
                    - text
                    - color
                  properties:
                    text:
                      type: string
                    color:
                      description: >
                        Color value. Accepts RGB array, hex string, or unsigned
                        32-bit integer.
                      oneOf:
                        - type: array
                          items:
                            type: integer
                            minimum: 0
                            maximum: 255
                          minItems: 3
                          maxItems: 3
                          description: RGB array [R, G, B]
                          examples:
                            - - 255
                              - 136
                              - 0
                        - type: string
                          pattern: ^#[0-9a-fA-F]{6}$
                          description: Hex string
                          examples:
                            - '#FF8800'
                        - type: integer
                          minimum: 0
                          maximum: 16777215
                          description: Unsigned 32-bit integer (0xRRGGBB)
                          examples:
                            - 16746496
                  description: Single string with explicit color override.
                  examples:
                    - text: CRITICAL
                      color: '#FF0000'
                - type: array
                  items:
                    type: object
                    required:
                      - t
                      - c
                    properties:
                      t:
                        type: string
                        description: Text content for this segment.
                      c:
                        description: >
                          Color value. Accepts RGB array, hex string, or
                          unsigned 32-bit integer.
                        oneOf:
                          - type: array
                            items:
                              type: integer
                              minimum: 0
                              maximum: 255
                            minItems: 3
                            maxItems: 3
                            description: RGB array [R, G, B]
                            examples:
                              - - 255
                                - 136
                                - 0
                          - type: string
                            pattern: ^#[0-9a-fA-F]{6}$
                            description: Hex string
                            examples:
                              - '#FF8800'
                          - type: integer
                            minimum: 0
                            maximum: 16777215
                            description: Unsigned 32-bit integer (0xRRGGBB)
                            examples:
                              - 16746496
                    description: A text fragment with its own color.
                  minItems: 1
                  maxItems: 8
                  description: Array of colored segments (concatenated in display order).
                  examples:
                    - - t: '22.5'
                        c: '#FF8800'
                      - t: C
                        c: '#666666'
            icon:
              type: string
              description: Icon name (without extension).
              examples:
                - smiley
            label:
              description: >
                Text field accepting three formats: plain string, colored string
                object, or array of colored segments (max 8).
              oneOf:
                - type: string
                  description: Plain text (uses default color).
                  examples:
                    - 22.5C
                - type: object
                  required:
                    - text
                    - color
                  properties:
                    text:
                      type: string
                    color:
                      description: >
                        Color value. Accepts RGB array, hex string, or unsigned
                        32-bit integer.
                      oneOf:
                        - type: array
                          items:
                            type: integer
                            minimum: 0
                            maximum: 255
                          minItems: 3
                          maxItems: 3
                          description: RGB array [R, G, B]
                          examples:
                            - - 255
                              - 136
                              - 0
                        - type: string
                          pattern: ^#[0-9a-fA-F]{6}$
                          description: Hex string
                          examples:
                            - '#FF8800'
                        - type: integer
                          minimum: 0
                          maximum: 16777215
                          description: Unsigned 32-bit integer (0xRRGGBB)
                          examples:
                            - 16746496
                  description: Single string with explicit color override.
                  examples:
                    - text: CRITICAL
                      color: '#FF0000'
                - type: array
                  items:
                    type: object
                    required:
                      - t
                      - c
                    properties:
                      t:
                        type: string
                        description: Text content for this segment.
                      c:
                        description: >
                          Color value. Accepts RGB array, hex string, or
                          unsigned 32-bit integer.
                        oneOf:
                          - type: array
                            items:
                              type: integer
                              minimum: 0
                              maximum: 255
                            minItems: 3
                            maxItems: 3
                            description: RGB array [R, G, B]
                            examples:
                              - - 255
                                - 136
                                - 0
                          - type: string
                            pattern: ^#[0-9a-fA-F]{6}$
                            description: Hex string
                            examples:
                              - '#FF8800'
                          - type: integer
                            minimum: 0
                            maximum: 16777215
                            description: Unsigned 32-bit integer (0xRRGGBB)
                            examples:
                              - 16746496
                    description: A text fragment with its own color.
                  minItems: 1
                  maxItems: 8
                  description: Array of colored segments (concatenated in display order).
                  examples:
                    - - t: '22.5'
                        c: '#FF8800'
                      - t: C
                        c: '#666666'
            color:
              description: >
                Color value. Accepts RGB array, hex string, or unsigned 32-bit
                integer.
              oneOf:
                - type: array
                  items:
                    type: integer
                    minimum: 0
                    maximum: 255
                  minItems: 3
                  maxItems: 3
                  description: RGB array [R, G, B]
                  examples:
                    - - 255
                      - 136
                      - 0
                - type: string
                  pattern: ^#[0-9a-fA-F]{6}$
                  description: Hex string
                  examples:
                    - '#FF8800'
                - type: integer
                  minimum: 0
                  maximum: 16777215
                  description: Unsigned 32-bit integer (0xRRGGBB)
                  examples:
                    - 16746496
            duration:
              type: integer
              description: Display duration in milliseconds.
              default: 10000
              examples:
                - 10000
            staleAfter:
              default: 0
              type: integer
              minimum: 0
              maximum: 604800
              description: >
                Silence tolerated before the app is considered stale, in
                seconds. 0 = never. The firmware cannot know when your data is
                due, so declare your own push interval plus a margin: a client
                pushing every 30 minutes sets 5400. Values above 604800 (7 days)
                are clamped.
              examples:
                - 5400
            staleBehavior:
              default: hide
              type: string
              enum:
                - hide
                - dim
                - badge
                - none
              description: >
                What the app does once stale. `hide` leaves the rotation until
                the client pushes again, `dim` stays visible dimmed with a STALE
                badge, `badge` stays visible at full colour with the badge,
                `none` shows no sign at all. `dim` and `badge` are only rendered
                by the tracker layout; sending them to another endpoint is
                rejected with HTTP 400.
              examples:
                - badge
            lifetime:
              type: integer
              deprecated: true
              description: >
                Former name of `staleAfter`, still accepted. Up to 1.3.1 the
                firmware compared this value against milliseconds while
                documenting seconds, so `3600` expired the app after 3.6
                seconds; it is now read as seconds.
              default: 0
            priority:
              type: integer
              minimum: -10
              maximum: 10
              description: Display priority (-10 to 10, higher = more important).
              default: 0
            zones:
              type: array
              items:
                type: object
                properties:
                  text:
                    description: >
                      Text field accepting three formats: plain string, colored
                      string object, or array of colored segments (max 8).
                    oneOf:
                      - type: string
                        description: Plain text (uses default color).
                        examples:
                          - 22.5C
                      - type: object
                        required:
                          - text
                          - color
                        properties:
                          text:
                            type: string
                          color:
                            description: >
                              Color value. Accepts RGB array, hex string, or
                              unsigned 32-bit integer.
                            oneOf:
                              - type: array
                                items:
                                  type: integer
                                  minimum: 0
                                  maximum: 255
                                minItems: 3
                                maxItems: 3
                                description: RGB array [R, G, B]
                                examples:
                                  - - 255
                                    - 136
                                    - 0
                              - type: string
                                pattern: ^#[0-9a-fA-F]{6}$
                                description: Hex string
                                examples:
                                  - '#FF8800'
                              - type: integer
                                minimum: 0
                                maximum: 16777215
                                description: Unsigned 32-bit integer (0xRRGGBB)
                                examples:
                                  - 16746496
                        description: Single string with explicit color override.
                        examples:
                          - text: CRITICAL
                            color: '#FF0000'
                      - type: array
                        items:
                          type: object
                          required:
                            - t
