# Weather schemas

ForecastDay:
  type: object
  required: [day, icon, temp_min, temp_max]
  properties:
    day:
      type: string
      maxLength: 3
      description: "Day abbreviation (3 chars, e.g. \"LUN\", \"MON\")."
      examples:
        - "LUN"
    icon:
      type: string
      description: >
        Weather icon name. Built-in PROGMEM icons: w_clear_day, w_clear_night,
        w_partly_day, w_partly_night, w_cloudy, w_rain, w_heavy_rain,
        w_thunder, w_snow, w_fog. Filesystem icons also accepted.
      examples:
        - "w_rain"
    temp_min:
      type: integer
      description: Minimum temperature.
    temp_max:
      type: integer
      description: Maximum temperature.

WeatherCurrent:
  type: object
  required: [icon, temp]
  properties:
    icon:
      type: string
      description: >
        Weather icon name. Use one of the built-in icons below, or any icon
        uploaded to the device filesystem.


        **Built-in weather icons** (8x8, stored in PROGMEM):

        | Name | Description |
        |------|-------------|
        | `w_clear_day` | Sunny |
        | `w_clear_night` | Clear night |
        | `w_partly_day` | Partly cloudy (day) |
        | `w_partly_night` | Partly cloudy (night) |
        | `w_cloudy` | Cloudy |
        | `w_rain` | Rain |
        | `w_heavy_rain` | Heavy rain |
        | `w_thunder` | Thunderstorm |
        | `w_snow` | Snow |
        | `w_fog` | Fog |
      examples:
        - "w_clear_day"
    temp:
      type: integer
      description: Current temperature.
    temp_min:
      type: integer
      description: "Today's minimum temperature."
    temp_max:
      type: integer
      description: "Today's maximum temperature."
    humidity:
      type: integer
      minimum: 0
      maximum: 100
      description: Humidity percentage.

TodayHour:
  type: object
  required: [h, temp]
  properties:
    h:
      type: integer
      minimum: 0
      maximum: 23
      description: Local hour of the day.
      examples:
        - 15
    temp:
      type: integer
      description: Temperature for that hour, same unit as the current conditions.
    pop:
      type: integer
      minimum: 0
      maximum: 100
      description: Precipitation probability, in percent.
    precip:
      type: integer
      minimum: 0
      maximum: 255
      description: "Precipitation quantity in tenths of a millimetre (2 means 0.2 mm)."

TodaySegment:
  type: object
  required: [from, to, icon]
  properties:
    from:
      type: integer
      minimum: 0
      maximum: 23
      description: First local hour of the segment (inclusive).
    to:
      type: integer
      minimum: 0
      maximum: 23
      description: Last local hour of the segment (inclusive).
    icon:
      type: string
      description: >
        Weather icon name for the whole segment. Built-in PROGMEM icons:
        w_clear_day, w_clear_night, w_partly_day, w_partly_night, w_cloudy,
        w_rain, w_heavy_rain, w_thunder, w_snow, w_fog.
      examples:
        - "w_partly_day"

WeatherToday:
  type: object
  description: >
    Hourly window displayed by the WeatherToday app: a temperature curve, the
    precipitation bars, and the sky segments above them. Hours are absolute
    local hours and are displayed as received, so the sender decides where the
    window starts. The app joins the rotation on the first payload carrying a
    non-empty hours array.
  properties:
    hours:
      type: array
      items:
        $ref: "#/TodayHour"
      maxItems: 12
      description: "Hourly values (up to 12). Extra entries are ignored."
    segments:
      type: array
      items:
        $ref: "#/TodaySegment"
      maxItems: 4
      description: >
        Sky segments covering the window (up to 4). Segments are computed by
        the sender; the device only renders their icon over the hour span.

WeatherUpdateRequest:
  type: object
  required: [current]
  properties:
    current:
      $ref: "#/WeatherCurrent"
    forecast:
      type: array
      items:
        $ref: "#/ForecastDay"
      maxItems: 7
      description: >
        Forecast days (up to 7). Displayed in pages of 3 columns with
        automatic scrolling. Page timing is proportional to app duration.
    today:
      $ref: "#/WeatherToday"

WeatherResponse:
  type: object
  properties:
    valid:
      type: boolean
      description: Whether weather data has been received.
    age:
      type: integer
      description: Seconds since last update.
    stale:
      type: boolean
      description: >
        True if data is older than 1 hour. Display falls back to simple clock.
    current:
      $ref: "#/WeatherCurrent"
    forecast:
      type: array
      items:
        $ref: "#/ForecastDay"
    today:
      $ref: "#/WeatherToday"
