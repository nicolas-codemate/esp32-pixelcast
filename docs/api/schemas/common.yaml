      description: "Single string with explicit color override."
    - type: array
      items:
        $ref: "#/TextSegment"
      minItems: 1
      maxItems: 3
      description: "Array of colored segments (concatenated in display order)."

PolymorphicTextField128x8:
  description: >
    Polymorphic text field bounded to 128 characters and 8 segments. Each bound sits in
