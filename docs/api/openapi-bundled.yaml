      responses:
        '200':
          description: Tracker data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  symbol:
                    type: string
                  icon:
                    type: string
                  currency:
                    type: string
                  value:
                    type: number
                    format: float
