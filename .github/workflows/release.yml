name: Release Firmware

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag against VERSION_STRING
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          STRING=$(sed -n 's/.*-D VERSION_STRING=\\"\(.*\)\\".*/\1/p' platformio.ini)
          MAJOR=$(sed -n 's/.*-D VERSION_MAJOR=\([0-9]*\).*/\1/p' platformio.ini)
          MINOR=$(sed -n 's/.*-D VERSION_MINOR=\([0-9]*\).*/\1/p' platformio.ini)
          PATCH=$(sed -n 's/.*-D VERSION_PATCH=\([0-9]*\).*/\1/p' platformio.ini)
          HEADER=$(sed -n 's/.*#define VERSION_STRING "\(.*\)".*/\1/p' include/config.h)

          # info.version of each spec, read from the info block so a version field
          # elsewhere in the document cannot be picked up instead.
          spec_version() {
            awk '
              /^info:/ { in_info = 1; next }
              /^[^[:space:]]/ { in_info = 0 }
              in_info && $1 == "version:" { gsub(/"/, "", $2); print $2; exit }
            ' "$1"
          }
          OPENAPI=$(spec_version docs/api/openapi.yaml)
          ASYNCAPI=$(spec_version docs/api/asyncapi.yaml)

          echo "tag=$TAG platformio=$STRING triple=$MAJOR.$MINOR.$PATCH header=$HEADER openapi=$OPENAPI asyncapi=$ASYNCAPI"

          if [ -z "$STRING" ]; then
            echo "::error::VERSION_STRING not found in platformio.ini"
            exit 1
          fi
          if [ "$TAG" != "$STRING" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION_STRING=$STRING in platformio.ini"
            exit 1
          fi
          if [ "$STRING" != "$MAJOR.$MINOR.$PATCH" ]; then
            echo "::error::VERSION_STRING=$STRING disagrees with VERSION_MAJOR/MINOR/PATCH=$MAJOR.$MINOR.$PATCH"
            exit 1
          fi
          if [ "$STRING" != "$HEADER" ]; then
            echo "::error::VERSION_STRING=$STRING disagrees with VERSION_STRING=$HEADER in include/config.h"
            exit 1
          fi
          if [ "$STRING" != "$OPENAPI" ]; then
            echo "::error::VERSION_STRING=$STRING disagrees with info.version=$OPENAPI in docs/api/openapi.yaml"
            exit 1
          fi
          if [ "$STRING" != "$ASYNCAPI" ]; then
            echo "::error::VERSION_STRING=$STRING disagrees with info.version=$ASYNCAPI in docs/api/asyncapi.yaml"
            exit 1
          fi

  build:
    needs: verify-version
    if: always() && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [trinity, devkit, esp32s3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

      - name: Name the binary after the release
        run: |
          VERSION=$(sed -n 's/.*-D VERSION_STRING=\\"\(.*\)\\".*/\1/p' platformio.ini)
          cp ".pio/build/${{ matrix.environment }}/firmware.bin" \
             "pixelcast-${{ matrix.environment }}-${VERSION}.bin"

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.environment }}
          path: pixelcast-${{ matrix.environment }}-*.bin
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Only trinity is published: devkit and esp32s3 are built above as a compile check,
      # but no hardware is available to test them, so they are not shipped as releases.
      - uses: actions/download-artifact@v8
        with:
          name: firmware-trinity

      - name: Attach the firmware to the release
        uses: softprops/action-gh-release@v3
        with:
          files: pixelcast-trinity-*.bin
          generate_release_notes: true
          fail_on_unmatched_files: true
