              title: Disques
              icon: disk
              rows:
                - label: root
                  value: 62%
                  percent: 62
                  color: '#4CAF50'
                - label: data
                  value: 88%
                  percent: 88
                  color: '#FFC107'
                - label: backup
                  value: 97%
                  percent: 97
                  color: '#F44336'
          - name: coloredLabels
            summary: Two-color title and labels split between a window and its reset
            payload:
              title:
                - t: 'Claude '
                  c: '#FFFFFF'
                - t: Max
                  c: '#D97757'
              icon: claude
              rows:
                - label:
                    - t: 5h
                      c: '#FFFFFF'
                    - t: ' reset'
                      c: '#888888'
                  value: 41%
                  percent: 41
                  color: '#4CAF50'
                - label:
                    - t: 7j
                      c: '#FFFFFF'
                    - t: ' reset'
                      c: '#888888'
                  value: 28%
                  percent: 28
                  color: '#4CAF50'
