  notify:
    address: '{prefix}/notify'
    description: Send a notification to the display.
    parameters:
      prefix:
        default: pixelcast
    messages:
      notificationMessage:
        payload:
          type: object
          required:
            - text
          properties:
            text:
              allOf:
                - description: >
                    Polymorphic text field bounded to 127 characters and 8
                    segments. Each bound sits in the form it applies to, so a
                    plain string is only measured in characters and a segment
                    array only in segments. The character budget is shared by
                    every segment.
                  oneOf:
                    - type: string
                      maxLength: 127
                      description: Plain text (uses default color).
                    - type: object
                      required:
                        - text
                        - color
                      properties:
                        text:
                          type: string
                          maxLength: 127
                        color:
                          description: >
                            Color value. Accepts RGB array, hex string, or
                            unsigned 32-bit integer.
                          oneOf:
                            - type: array
                              items:
                                type: integer
                                minimum: 0
                                maximum: 255
                              minItems: 3
                              maxItems: 3
                              description: RGB array [R, G, B]
                              examples:
                                - - 255
                                  - 136
                                  - 0
                            - type: string
                              pattern: ^#[0-9a-fA-F]{6}$
                              description: Hex string
                              examples:
                                - '#FF8800'
                            - type: integer
                              minimum: 0
                              maximum: 16777215
                              description: Unsigned 32-bit integer (0xRRGGBB)
                              examples:
                                - 16746496
                      description: Single string with explicit color override.
                    - type: array
                      items:
                        type: object
                        required:
                          - t
                          - c
                        properties:
                          t:
                            type: string
                            description: Text content for this segment.
                          c:
                            description: >
                              Color value. Accepts RGB array, hex string, or
                              unsigned 32-bit integer.
                            oneOf:
                              - type: array
                                items:
                                  type: integer
                                  minimum: 0
                                  maximum: 255
                                minItems: 3
                                maxItems: 3
                                description: RGB array [R, G, B]
                                examples:
                                  - - 255
                                    - 136
                                    - 0
                              - type: string
                                pattern: ^#[0-9a-fA-F]{6}$
                                description: Hex string
                                examples:
                                  - '#FF8800'
                              - type: integer
                                minimum: 0
                                maximum: 16777215
                                description: Unsigned 32-bit integer (0xRRGGBB)
                                examples:
                                  - 16746496
                        description: A text fragment with its own color.
                      minItems: 1
                      maxItems: 8
                      description: >-
                        Array of colored segments (concatenated in display
                        order).
              description: >
                Notification text, required. Accepts the three forms of a
                colored text field - plain string, single colored string, or up
                to eight colored segments concatenated in display order.
                Segments color the text and nothing else: the two separator
                lines keep the color they already had, and `color` still colors
                any text sent without a color of its own. A text that ends up
                empty is refused with HTTP 400 `Missing text`, and that covers
                `""`, `{"text": ""}` and `[]` alike; over MQTT the message is
                dropped with a serial log. The 127 characters are shared by
                every segment, and the two forms overflow differently: a plain
                string is cut at the last character that fits, while the first
                segment that no longer fits is dropped whole, text included,
                along with everything after it. Accents are shown as their
                closest ASCII letter, and since segment boundaries are counted
                in bytes but applied glyph by glyph, a boundary that comes after
                an accented character or a degree sign in the same string is
                applied one glyph late for each of them.
              examples:
                - Build passed
                - - t: 'Build '
                    c: '#FFFFFF'
                  - t: failed
                    c: '#FF0000'
            id:
              type: string
              description: >
                Optional unique ID. If omitted, auto-generated as
                `notif_<millis>`.
            icon:
              type: string
              description: Icon name (without extension).
            color:
              allOf:
                - description: >
                    Color value. Accepts RGB array, hex string, or unsigned
                    32-bit integer.
                  oneOf:
                    - type: array
                      items:
                        type: integer
                        minimum: 0
                        maximum: 255
                      minItems: 3
                      maxItems: 3
                      description: RGB array [R, G, B]
                      examples:
                        - - 255
                          - 136
                          - 0
                    - type: string
                      pattern: ^#[0-9a-fA-F]{6}$
                      description: Hex string
                      examples:
                        - '#FF8800'
                    - type: integer
                      minimum: 0
                      maximum: 16777215
                      description: Unsigned 32-bit integer (0xRRGGBB)
                      examples:
                        - 16746496
              default: '#FFFFFF'
              description: >
                Two roles. It is the color the text takes wherever `text`
                carries none of its own, and it paints the two separator lines -
                unless `background` is set, which takes the lines over. A `text`
                written entirely in segments therefore still needs `color` set
                if the lines are meant to match it.
            background:
              description: >
                Color value. Accepts RGB array, hex string, or unsigned 32-bit
                integer.
              oneOf:
                - type: array
                  items:
                    type: integer
                    minimum: 0
                    maximum: 255
                  minItems: 3
                  maxItems: 3
                  description: RGB array [R, G, B]
                  examples:
                    - - 255
                      - 136
                      - 0
                - type: string
                  pattern: ^#[0-9a-fA-F]{6}$
                  description: Hex string
                  examples:
                    - '#FF8800'
                - type: integer
                  minimum: 0
                  maximum: 16777215
                  description: Unsigned 32-bit integer (0xRRGGBB)
                  examples:
                    - 16746496
            duration:
              type: integer
              description: Display duration in milliseconds.
              default: 5000
            hold:
              type: boolean
              description: >
                Hold notification until explicitly dismissed. Overrides
                duration.
              default: false
            urgent:
              type: boolean
              description: Jump to front of notification queue.
              default: false
            stack:
              type: boolean
              description: >
                Queue sequentially with other notifications (true) vs replace
                current notification (false).
              default: true
        examples:
          - name: alert
            summary: Urgent notification
            payload:
              text: Alert!
              icon: warning
              color: '#FF0000'
              urgent: true
          - name: segmentedAlert
            summary: Colored segments, with `color` still setting the separator lines
            payload:
              text:
                - t: 'Build '
                  c: '#FFFFFF'
                - t: failed
                  c: '#FF0000'
              icon: warning
              color: '#FF0000'
              urgent: true
