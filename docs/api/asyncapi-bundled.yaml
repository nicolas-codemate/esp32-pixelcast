  reboot:
    address: '{prefix}/reboot'
    description: Reboot the device. Payload can be empty.
    parameters:
      prefix:
        default: pixelcast
    messages:
      rebootMessage:
        payload:
          type: 'null'
        description: Empty payload (or any payload - ignored).
  sleep:
    address: '{prefix}/sleep'
    description: >
      Set a manual sleep override. Payload is `{"until": <epoch>}` where the
      epoch is a UTC Unix timestamp (seconds since 1970-01-01 UTC). Equivalent
      to the REST call `POST /api/sleep` with `{"sleep_until": <epoch>}`. Past
      values are rejected (logged to serial; state unchanged).
    parameters:
      prefix:
        default: pixelcast
    messages:
      sleepOverrideMessage:
        payload:
          type: object
          required:
            - until
          properties:
            until:
              type: integer
              minimum: 0
              description: >
                UTC Unix timestamp when the override expires (seconds since
                1970-01-01 UTC). Past values are rejected.
              examples:
                - 4102444800
        examples:
          - name: oneHourOverride
            summary: Sleep until a specific epoch
            payload:
              until: 4102444800
  wake:
    address: '{prefix}/wake'
    description: >
      Clear the manual sleep override and wake the device immediately. Payload
      can be empty. Equivalent to `POST /api/sleep/wake`.
    parameters:
      prefix:
        default: pixelcast
    messages:
      wakeMessage:
        payload:
          type: 'null'
        description: >
          Wake-now command. Payload is ignored. Clears the active sleep
          override; schedule-based sleep is not affected.
  status:
    address: '{prefix}/status'
    description: >
      Connection status (LWT). Published as retained. "online" on connect,
      "offline" as Last Will on disconnect.
    parameters:
      prefix:
        default: pixelcast
    messages:
      statusMessage:
        payload:
          type: string
          enum:
            - online
            - offline
        examples:
          - name: online
            payload: online
          - name: offline
            payload: offline
  stats:
    address: '{prefix}/stats'
    description: |
      System statistics published every 60 seconds. Not retained.
    parameters:
      prefix:
        default: pixelcast
    messages:
      statsMessage:
        payload:
          type: object
          description: Compact stats payload published over MQTT every 60 seconds.
          properties:
            uptime:
              type: integer
            freeHeap:
              type: integer
            brightness:
              type: integer
            rssi:
              type: integer
            appCount:
              type: integer
            version:
              type: string
            currentApp:
              type: string
        examples:
          - name: stats
            payload:
              uptime: 3600
              freeHeap: 120000
              brightness: 128
              rssi: -45
              appCount: 3
              version: 0.1.0-dev
              currentApp: weather_clock
