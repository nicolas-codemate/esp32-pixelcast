                      - '#FF8800'
                  sparklineColor:
                    type: string
                    pattern: '^#[0-9a-fA-F]{6}$'
                    deprecated: true
                    description: 'Hex color string. Stored and echoed, but no longer drawn.'
                    examples:
                      - '#00D4FF'
                  bottomText:
                    allOf:
                      - $ref: '#/paths/~1custom/post/requestBody/content/application~1json/schema/properties/text'
                    description: |
                      Echoed in the form it was stored: a plain string unless the value was written with color segments, in which case it comes back as the segment array. A client that only ever sends plain strings only ever reads plain strings - but a tracker fed by several producers can come back as an array to a client that did not send one.
                  sparklinePeriod:
                    type: string
                  sparklineRef:
                    type: string
                    enum:
                      - open
                      - last
                  age:
                    type: integer
