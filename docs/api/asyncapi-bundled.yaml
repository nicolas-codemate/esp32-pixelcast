  brightness:
    address: '{prefix}/brightness'
    description: Set display brightness.
    parameters:
      prefix:
        default: pixelcast
    messages:
      brightnessMessage:
        payload:
          type: object
          required:
            - brightness
          properties:
            brightness:
              type: integer
              minimum: 0
              maximum: 255
        examples:
          - name: setBrightness
            payload:
              brightness: 50
  settings:
    address: '{prefix}/settings'
    description: >
      Update device settings (partial update). Same payload as `POST
      /api/settings`, except that out-of-range values are clamped to their
      bounds instead of rejected, since MQTT has no response channel.
    parameters:
      prefix:
        default: pixelcast
    messages:
      settingsMessage:
        payload:
          type: object
          description: >
            Partial update: only provided fields are changed. Omitted fields
            keep their current values.
          properties:
            brightness:
              type: integer
              minimum: 0
              maximum: 255
              description: Display brightness (0-255).
            autoRotate:
              type: boolean
              description: Enable/disable automatic app rotation.
            defaultDuration:
              type: integer
              description: Default app display duration in milliseconds.
            weatherDuration:
              type: integer
              minimum: 3000
              maximum: 60000
              default: 12000
              description: >
                Display duration of the `weatherclock` app in milliseconds. It
                has its own duration because it runs an internal carousel — an
                hourly chart page plus the forecast day pages — and splits this
                time between them, so it needs more of it than a plain app.
                Applied to the running app immediately, no reboot needed, and
                persisted across reboots. Bounded to 3000-60000: below 3000 the
                carousel pages flip faster than they can be read, above 60000
                the rotation parks on weather for a full minute.
            ntp:
              type: object
              description: >
                Update NTP source. Either field can be omitted; both are
                re-applied without reboot via `configTzTime()`.
              properties:
                server:
                  type: string
                  description: NTP server hostname.
                tz_posix:
                  type: string
                  maxLength: 63
                  description: >
                    POSIX TZ string controlling local time display and DST
                    behaviour. Example: "CET-1CEST,M3.5.0,M10.5.0/3" for
                    Europe/Paris with EU DST. The device does not embed an IANA
                    tz database — clients should convert IANA names (e.g.
                    "Europe/Paris") to POSIX TZ before sending.
                  examples:
                    - CET-1CEST,M3.5.0,M10.5.0/3
                    - UTC0
                    - EST5EDT,M3.2.0,M11.1.0
                  default: CET-1CEST,M3.5.0,M10.5.0/3
        examples:
          - name: updateSettings
            payload:
              brightness: 100
              autoRotate: true
              defaultDuration: 15000
              weatherDuration: 12000
  weather:
    address: '{prefix}/weather'
    description: |
      Update weather data for the WeatherClock system app.
    parameters:
      prefix:
        default: pixelcast
    messages:
      weatherMessage:
        payload:
          type: object
          required:
            - current
          properties:
            current:
              type: object
              required:
                - icon
                - temp
              properties:
                icon:
                  type: string
                  description: >
                    Weather icon name. Use one of the built-in icons below, or
                    any icon uploaded to the device filesystem.


                    **Built-in weather icons** (8x8, stored in PROGMEM):

                    | Name | Description | |------|-------------| |
                    `w_clear_day` | Sunny | | `w_clear_night` | Clear night | |
                    `w_partly_day` | Partly cloudy (day) | | `w_partly_night` |
                    Partly cloudy (night) | | `w_cloudy` | Cloudy | | `w_rain` |
                    Rain | | `w_heavy_rain` | Heavy rain | | `w_thunder` |
                    Thunderstorm | | `w_snow` | Snow | | `w_fog` | Fog |
                  examples:
                    - w_clear_day
                temp:
                  type: integer
                  description: Current temperature.
                temp_min:
                  type: integer
                  description: Today's minimum temperature.
                temp_max:
                  type: integer
                  description: Today's maximum temperature.
                humidity:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: Humidity percentage.
            forecast:
              type: array
              items:
                type: object
                required:
                  - day
                  - icon
                  - temp_min
                  - temp_max
                properties:
                  day:
                    type: string
                    maxLength: 3
                    description: Day abbreviation (3 chars, e.g. "LUN", "MON").
                    examples:
                      - LUN
                  icon:
                    type: string
                    description: >
                      Weather icon name. Built-in PROGMEM icons: w_clear_day,
                      w_clear_night, w_partly_day, w_partly_night, w_cloudy,
                      w_rain, w_heavy_rain, w_thunder, w_snow, w_fog. Filesystem
                      icons also accepted.
                    examples:
                      - w_rain
                  temp_min:
                    type: integer
                    description: Minimum temperature.
                  temp_max:
                    type: integer
                    description: Maximum temperature.
              maxItems: 7
              description: >
                Forecast days, displayed in pages of 3 columns with automatic
                scrolling. Page timing is proportional to app duration.


                Start at tomorrow, not today: today's minimum and maximum are
                already on screen at all times as `current.temp_min` and
                `current.temp_max`, so a column for today would repeat them.


                The carousel is capped at 3 pages, which bounds how many days
                are actually shown. Sending `today` spends the first page on the
                hourly chart, leaving 6 days; without it, 9 days would fit but
                `maxItems` caps the array at 7. Days beyond what the carousel
                can show are stored and echoed back, but never displayed.
            today:
              type: object
              description: >
                Hourly window charted on the first carousel page of the
                WeatherClock app: a temperature curve over the precipitation
                bars. Hours are absolute local hours and are displayed as
                received, so the sender decides where the window starts. The
                numbers framing the curve are the temperatures of the first and
                last charted hours. The page appears on the first payload
                carrying a non-empty hours array. The segments array is stored
                and echoed back but is not currently drawn.
              properties:
                hours:
                  type: array
                  items:
                    type: object
                    required:
                      - h
                      - temp
                    properties:
                      h:
                        type: integer
                        minimum: 0
                        maximum: 23
                        description: Local hour of the day.
                        examples:
                          - 15
                      temp:
                        type: integer
                        minimum: -100
                        maximum: 100
                        description: >
                          Temperature for that hour, same unit as the current
                          conditions. Values outside the range are clamped to
                          it.
                      pop:
                        type: integer
                        minimum: 0
                        maximum: 100
                        description: Precipitation probability, in percent.
                      precip:
                        type: integer
                        minimum: 0
                        maximum: 255
                        description: >-
                          Precipitation quantity in tenths of a millimetre (2
                          means 0.2 mm).
                  maxItems: 12
                  description: Hourly values (up to 12). Extra entries are ignored.
                segments:
                  type: array
                  items:
                    type: object
                    required:
                      - from
                      - to
                      - icon
                    properties:
                      from:
                        type: integer
                        minimum: 0
                        maximum: 23
                        description: First local hour of the segment (inclusive).
                      to:
                        type: integer
                        minimum: 0
                        maximum: 23
                        description: Last local hour of the segment (inclusive).
                      icon:
                        type: string
                        maxLength: 31
                        description: >
                          Weather icon name for the whole segment. Built-in
                          PROGMEM icons: w_clear_day, w_clear_night,
                          w_partly_day, w_partly_night, w_cloudy, w_rain,
                          w_heavy_rain, w_thunder, w_snow, w_fog. Longer names
                          are truncated to 31 characters.
                        examples:
                          - w_partly_day
                  maxItems: 4
                  description: >
                    Sky segments covering the window (up to 4). Extra entries
                    are ignored. Segments are computed by the sender; they are
                    stored and echoed back but are not currently drawn.
            staleAfter:
              default: 3600
              type: integer
              minimum: 0
              maximum: 604800
              description: >
                Silence tolerated before the app is considered stale, in
                seconds. 0 = never. The firmware cannot know when your data is
                due, so declare your own push interval plus a margin: a client
                pushing every 30 minutes sets 5400. Values above 604800 (7 days)
                are clamped.
              examples:
                - 5400
            staleBehavior:
              allOf:
                - type: string
                  enum:
                    - hide
                    - dim
                    - badge
                    - none
                  description: >
                    What the app does once stale. `hide` leaves the rotation
                    until the client pushes again, `dim` stays visible dimmed
                    with a STALE badge, `badge` stays visible at full colour
                    with the badge, `none` shows no sign at all. `dim` and
                    `badge` are only rendered by the tracker layout; sending
                    them to another endpoint is rejected with HTTP 400.
                  examples:
                    - badge
              enum:
                - hide
                - none
              default: hide
              description: >
                A forecast that stopped being refreshed turns wrong rather than
                merely old, so `hide` falls back to the clock. `none` keeps
                showing the last forecast. `dim` and `badge` belong to the
                tracker layout and are rejected here with HTTP 400.
        examples:
          - name: currentAndForecast
            payload:
              current:
                icon: w_clear_day
                temp: 22
                temp_min: 16
                temp_max: 29
                humidity: 50
              forecast:
                - day: MON
                  icon: w_partly_day
                  temp_min: 14
                  temp_max: 23
                - day: TUE
                  icon: w_rain
                  temp_min: 10
                  temp_max: 17
              today:
                hours:
                  - h: 15
                    temp: 22
                    pop: 0
                    precip: 0
                  - h: 16
                    temp: 23
                    pop: 10
                    precip: 2
                  - h: 17
                    temp: 23
                    pop: 40
                    precip: 8
                  - h: 18
                    temp: 21
                    pop: 80
                    precip: 25
                segments:
                  - from: 15
                    to: 16
                    icon: w_partly_day
                  - from: 17
                    to: 18
                    icon: w_rain
  tracker:
    address: '{prefix}/tracker'
    description: >
      Create or update a tracker. Name must be in the JSON body. Send
      `{"delete": true, "name": "btc"}` to delete.
    parameters:
      prefix:
        default: pixelcast
    messages:
      trackerMessage:
        payload:
          type: object
          properties:
            name:
              type: string
              description: >
                Tracker identifier. Can also be passed as `?name=` query
                parameter.
            symbol:
              type: string
              maxLength: 31
              description: >
                Headline shown on the top row (e.g. "BTC", "Amundi PEA Monde").
                Longer than the row is wide is fine: the display scrolls it,
                pausing at each end. The row holds eight characters beside an
                icon and ten without one, since a tracker with no `icon` gives
                its headline the full width. The panel has no accented glyphs,
                so Latin-1 accents are shown as their closest ASCII letter -
                "Santé" reads "Sante". Anything else outside ASCII is dropped:
                "Cœur" reads "Cur", and a typographic apostrophe disappears.
              examples:
                - BTC
                - Amundi PEA Monde
            icon:
              type: string
              description: Icon name from filesystem.
              examples:
                - bitcoin
            currency:
              type: string
              maxLength: 7
              description: Currency label (e.g. "USD", "EUR").
              examples:
                - USD
            value:
              type: number
              format: float
              description: |
                Current price/value. The panel shows as many decimals as fit the value row, which the currency label shortens when one is set. Two decimals are always shown when they fit, so 128.4 reads 128.40 and 6.232 keeps its third decimal. Digits beyond the seven a float can carry are dropped rather than printed as rounding noise.
              examples:
                - 98452.3
            change:
              type: number
              format: float
              description: Change percentage (positive or negative).
              examples:
                - 2.14
            sparkline:
              type: array
              items:
                type: number
                format: float
              maxItems: 24
              description: >
                Up to 24 data points for the sparkline chart. Values are
                auto-scaled to fit the chart area (min/max normalization to
                uint16 0-65535).
              examples:
                - - 92100
                  - 89300
                  - 93200
                  - 91800
                  - 95400
                  - 94100
                  - 97600
                  - 96200
                  - 98452
            symbolColor:
              description: >
                Color value. Accepts RGB array, hex string, or unsigned 32-bit
