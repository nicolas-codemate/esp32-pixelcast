  tracker:
    address: '{prefix}/tracker'
    description: >
      Create or update a tracker. Name must be in the JSON body. Send
      `{"delete": true, "name": "btc"}` to delete.
    parameters:
      prefix:
        default: pixelcast
    messages:
      trackerMessage:
        payload:
          type: object
          properties:
            name:
              type: string
              description: >
                Tracker identifier. Can also be passed as `?name=` query
                parameter.
            symbol:
              type: string
              maxLength: 31
              description: >
                Headline shown on the top row (e.g. "BTC", "Amundi PEA Monde").
                Longer than the row is wide is fine: the display scrolls it,
                pausing at each end. The row holds eight characters beside an
                icon and ten without one, since a tracker with no `icon` gives
                its headline the full width. The panel has no accented glyphs,
                so Latin-1 accents are shown as their closest ASCII letter -
                "Santé" reads "Sante". Anything else outside ASCII is dropped:
                "Cœur" reads "Cur", and a typographic apostrophe disappears.
              examples:
                - BTC
                - Amundi PEA Monde
            icon:
              type: string
              description: Icon name from filesystem.
              examples:
                - bitcoin
            currency:
              type: string
              maxLength: 7
              description: Currency label (e.g. "USD", "EUR").
              examples:
                - USD
            value:
              type: number
              format: float
              description: >
                Current price/value. The panel shows as many decimals as fit the
                value row, which the currency label shortens when one is set.
                Two decimals are always shown when they fit, so 128.4 reads
                128.40 and 6.232 keeps its third decimal. Digits beyond the
                seven a float can carry are dropped rather than printed as
                rounding noise.
              examples:
                - 98452.3
            change:
              type: number
              format: float
              description: Change percentage (positive or negative).
              examples:
                - 2.14
            sparkline:
              type: array
              items:
                type: number
                format: float
              maxItems: 63
              description: >
                Price series for the chart. The chart is 63 columns wide and
                plots one point per column, so 63 points are drawn as sent and a
                shorter series is stretched across the same columns, keeping its
                shape and both its endpoints. It is 20 rows tall, or 32 when the
                tracker sends no `bottomText`. Values are auto-scaled to fit the
                chart area (min/max normalization to uint16 0-65535); a series
                that never moves is drawn along the middle of the chart rather
                than along its floor. The curve is green above the reference
                line and red below it - see `sparklineRef`. Over MQTT the whole
                payload has to fit the 2 KB broker buffer, which a 63-point
                series plus 63 volumes fills at about 1.5 KB; the REST endpoint
                accepts up to 16 KB.
              examples:
                - - 92100
                  - 89300
                  - 93200
                  - 91800
                  - 95400
                  - 94100
                  - 97600
                  - 96200
                  - 98452
            volumes:
              type: array
              items:
                type: number
                format: float
              maxItems: 63
              description: >
                Optional volume series, drawn as midnight blue bars behind the
                curve. It keeps its own length and is stretched over the 63
                columns like `sparkline`, taking the nearest point rather than
                interpolating. It is scaled against its own largest value, not
                between its extremes, so a bar is read from zero. Bars are at
                least one pixel tall and at most three fifths of the chart. Omit
                the field to leave the chart without bars.
              examples:
                - - 3.2
                  - 4.1
                  - 3.8
                  - 5.6
                  - 4.9
                  - 6.2
                  - 5.1
                  - 4.4
                  - 6
            sparklineRef:
              type: string
              enum:
                - open
                - last
              default: open
              description: >
                Which price the chart compares every column against. `open` (the
                default) takes the first point of the series, so green means "up
                since the period opened". `last` takes the final point, so green
                means "the price was higher then than it is now" - which turns a
                rising week mostly red, the opposite of the usual reading. Both
                ends are marked: the reference is a dashed line every other
                pixel, the other end a darker dashed line, hidden when the two
                ends land within a pixel of each other.
            symbolColor:
              allOf:
                - description: >
                    Color value. Accepts RGB array, hex string, or unsigned
                    32-bit integer.
                  oneOf:
                    - type: array
                      items:
                        type: integer
                        minimum: 0
                        maximum: 255
                      minItems: 3
                      maxItems: 3
                      description: RGB array [R, G, B]
                      examples:
                        - - 255
                          - 136
                          - 0
                    - type: string
                      pattern: ^#[0-9a-fA-F]{6}$
                      description: Hex string
                      examples:
                        - '#FF8800'
                    - type: integer
                      minimum: 0
                      maximum: 16777215
                      description: Unsigned 32-bit integer (0xRRGGBB)
                      examples:
                        - 16746496
              default: '#00DC3C'
              description: >-
                Headline color on the top row. Defaults to the green of the
                tracker screen.
            sparklineColor:
              allOf:
                - description: >
                    Color value. Accepts RGB array, hex string, or unsigned
                    32-bit integer.
                  oneOf:
                    - type: array
                      items:
                        type: integer
                        minimum: 0
                        maximum: 255
                      minItems: 3
                      maxItems: 3
                      description: RGB array [R, G, B]
                      examples:
                        - - 255
                          - 136
                          - 0
                    - type: string
                      pattern: ^#[0-9a-fA-F]{6}$
                      description: Hex string
                      examples:
                        - '#FF8800'
                    - type: integer
                      minimum: 0
                      maximum: 16777215
                      description: Unsigned 32-bit integer (0xRRGGBB)
                      examples:
                        - 16746496
              deprecated: true
              description: >
                No longer drawn. The curve takes its two colors from its
                position against `sparklineRef`. Still accepted and echoed back
                so existing clients keep working.
            bottomText:
              allOf:
                - description: >
                    Polymorphic text field bounded to 31 characters and 8
                    segments. Each bound sits in the form it applies to, so a
                    plain string is only measured in characters and a segment
                    array only in segments. The character budget is shared by
                    every segment.
                  oneOf:
                    - type: string
                      maxLength: 31
                      description: Plain text (uses default color).
                    - type: object
                      required:
                        - text
                        - color
                      properties:
                        text:
                          type: string
                          maxLength: 31
                        color:
                          description: >
                            Color value. Accepts RGB array, hex string, or
                            unsigned 32-bit integer.
                          oneOf:
                            - type: array
                              items:
                                type: integer
                                minimum: 0
                                maximum: 255
                              minItems: 3
                              maxItems: 3
                              description: RGB array [R, G, B]
                              examples:
                                - - 255
                                  - 136
                                  - 0
                            - type: string
                              pattern: ^#[0-9a-fA-F]{6}$
                              description: Hex string
                              examples:
                                - '#FF8800'
                            - type: integer
                              minimum: 0
                              maximum: 16777215
                              description: Unsigned 32-bit integer (0xRRGGBB)
                              examples:
                                - 16746496
                      description: Single string with explicit color override.
                    - type: array
                      items:
                        type: object
                        required:
                          - t
                          - c
                        properties:
                          t:
                            type: string
                            description: Text content for this segment.
                          c:
                            description: >
                              Color value. Accepts RGB array, hex string, or
                              unsigned 32-bit integer.
                            oneOf:
                              - type: array
                                items:
                                  type: integer
                                  minimum: 0
                                  maximum: 255
                                minItems: 3
                                maxItems: 3
                                description: RGB array [R, G, B]
                                examples:
                                  - - 255
                                    - 136
                                    - 0
                              - type: string
                                pattern: ^#[0-9a-fA-F]{6}$
                                description: Hex string
                                examples:
                                  - '#FF8800'
                              - type: integer
                                minimum: 0
                                maximum: 16777215
                                description: Unsigned 32-bit integer (0xRRGGBB)
                                examples:
                                  - 16746496
                        description: A text fragment with its own color.
                      minItems: 1
                      maxItems: 8
                      description: >-
                        Array of colored segments (concatenated in display
                        order).
              description: >
                Optional footer text on the bottom row, in the same font as the
                price: ten characters fit, and anything longer scrolls, pausing
                at each end. Leaving it out hands its rows, and those of the
                separator above it, to the chart, which grows from 20 rows to
                32. Accepts the same three forms as a custom app's text: plain
                string, single colored string, or colored segments - the 31
                characters are shared by every segment, a segment that no longer
                fits being dropped whole. Accents are transliterated as they are
                in `symbol`, and the degree sign is dropped. A tracker left on
                the default `staleBehavior` of `dim` dims these colors along
                with the rest of the screen.
              examples:
                - ATH 73.6K 03/24
                - - t: 'Vol '
                    c: '#888888'
                  - t: 42B
                    c: '#00D4FF'
            sparklinePeriod:
              type: string
              maxLength: 4
              default: 24h
              description: >
                Period covered by the sparkline series, set into the rule above
                the chart, which stops short of it. Two characters read best -
                "7D", "1M", "3M", "1Y" - a longer label only shortens the rule.
                Send an empty string to hide it and run the rule the full width.
              examples:
                - 7D
            duration:
              type: integer
              description: Display duration in milliseconds.
              default: 10000
            staleAfter:
              default: 3600
              type: integer
              minimum: 0
              maximum: 604800
              description: >
                Silence tolerated before the app is considered stale, in
                seconds. 0 = never. The firmware cannot know when your data is
                due, so declare your own push interval plus a margin: a client
                pushing every 30 minutes sets 5400. Values above 604800 (7 days)
                are clamped.
              examples:
                - 5400
            staleBehavior:
              default: dim
              type: string
              enum:
                - hide
                - dim
                - badge
                - none
              description: >
                What the app does once stale. `hide` leaves the rotation until
                the client pushes again, `dim` stays visible dimmed with a STALE
                badge, `badge` stays visible at full colour with the badge,
                `none` shows no sign at all. `dim` and `badge` are only rendered
                by the tracker and gauge layouts; sending them to another
                endpoint is rejected with HTTP 400.
              examples:
                - badge
        examples:
          - name: btcTracker
            summary: BTC price update
            payload:
              symbol: BTC
              icon: bitcoin
              currency: USD
              value: 98452.3
              change: 2.14
              sparkline:
                - 92100
                - 89300
                - 93200
                - 91800
                - 95400
              volumes:
                - 3.2
                - 4.1
                - 3.8
                - 5.6
                - 4.9
              sparklineRef: open
              symbolColor: '#FF8800'
              bottomText: ATH 73.6K 03/24
              sparklinePeriod: 7D
          - name: fundTracker
            summary: Fund with a scrolling name and a colored footer
            payload:
              symbol: Amundi PEA Monde
              icon: world
              currency: EUR
              value: 34.82
              change: 0.63
              symbolColor: '#4CAF50'
              bottomText:
                - t: 'MSCI '
                  c: '#888888'
                - t: World
                  c: '#00D4FF'
          - name: deleteTracker
            summary: Delete a tracker
            payload:
              delete: true
